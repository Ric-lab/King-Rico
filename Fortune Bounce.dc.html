<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="./ui/header.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face { font-family: 'Baloo 2'; font-style: normal; font-weight: 400 800; font-display: swap; src: url('assets/fonts/baloo2-latin.woff2') format('woff2'); }
@font-face { font-family: 'Rammetto One'; font-style: normal; font-weight: 400; font-display: swap; src: url('assets/fonts/rammettoone-latin.woff2') format('woff2'); }
html, body { margin: 0; padding: 0; height: 100%; background: #0c0318; font-family: 'Baloo 2', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
a { color: #ffd257; text-decoration: none; } a:hover { color: #fff1b8; }
@keyframes bnPop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes bnFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes bnBeat { 0% { transform: scale(1); } 35% { transform: scale(1.14); } 100% { transform: scale(1); } }
@keyframes bnHand { 0%, 100% { transform: translateX(-70px); } 50% { transform: translateX(70px); } }
@keyframes bnPerf { 0% { transform: translateY(14px) scale(.7); opacity: 0; } 20% { transform: translateY(0) scale(1.12); opacity: 1; } 70% { transform: translateY(-6px) scale(1); opacity: 1; } 100% { transform: translateY(-18px) scale(.96); opacity: 0; } }
@keyframes bnNo { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@keyframes bnShine { 0% { transform: translateX(-160%) skewX(-18deg); } 60%, 100% { transform: translateX(520%) skewX(-18deg); } }
@keyframes rcFade { from { opacity: 0; } to { opacity: 1; } }
</style>
</helmet>
<div style="position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: center; overflow: hidden; touch-action: manipulation; background: #0c0318;">
  <div ref="{{ stageRef }}" data-screen-label="Fortune Bounce" style="position: relative; flex: 0 0 auto; width: 453px; height: 802px; transform: scale({{ scale }}); transform-origin: 50% 0; user-select: none; -webkit-user-select: none;">
    <x-import component-from-global-scope="bounce-3d" from="./bounce3d.js" style="position: absolute; left: 0; top: 0; width: 453px; height: 802px;" hint-size="453px,802px"></x-import>

    <div class="kr-hud-balance" role="status" aria-label="Seu saldo: {{ balanceText }} moedas" style="position: absolute; z-index: 20; left: 18px; top: 24px; width: 130px; height: 36px; border-radius: 18px; overflow: hidden; background-image: url('assets/stage-hd-c.webp'); background-size: 453px 802px; background-position: -19.333px -30px; background-repeat: no-repeat; transform: scale(1.25); transform-origin: 0 50%;">
      <div style="position: absolute; left: 39px; top: -2px; width: 88px; height: 39px; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: {{ balanceSize }}; font-weight: 800; color: #662c2c; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; transform: translateY(.05em);">{{ balanceText }}</span>
      </div>
    </div>
    <a href="Home.dc.html" onClick="{{ goHome }}" aria-label="Voltar para o início" class="kr-hud-home" style="z-index: 20; cursor: pointer; border-radius: 50%; overflow: hidden; " style-active="filter: brightness(.6) saturate(1.2);"></a>
    <x-import from="./ui/menu.js" component="MenuButton" dc-props="{{ menuButton }}"></x-import>

    <!-- multiplicador atual + garantido -->
    <sc-if value="{{ perfShow }}" hint-placeholder-val="{{ false }}">
      <div key="{{ perfKey }}" style="position: absolute; z-index: 10; left: 0; right: 0; top: 168px; display: flex; justify-content: center; pointer-events: none; animation: bnPerf .9s ease-out forwards;">
        <span style="font-family: 'Rammetto One', 'Baloo 2', sans-serif; font-size: 26px; line-height: 1; color: #ffffff; text-shadow: 0 0 14px rgba(255,230,140,.95), 0 2px 0 #6b2e05; white-space: nowrap;">{{ perfText }}</span>
      </div>
    </sc-if>
    <div style="position: absolute; z-index: 10; left: 0; right: 0; top: 96px; display: flex; justify-content: center; align-items: center; gap: 10px; pointer-events: none; opacity: {{ multOp }};">
      <div key="{{ multKey }}" style="height: 56px; padding: 0 22px; border-radius: 28px; display: flex; align-items: center; background: rgba(12,3,24,.72); box-shadow: 0 0 0 2px rgba(255,210,87,.8), 0 0 18px rgba(255,190,60,.35); animation: bnBeat .35s ease-out;">
        <span style="font-family: 'Rammetto One', 'Baloo 2', sans-serif; font-size: 32px; line-height: 1; color: #ffe27a; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(255,200,80,.7);">{{ multText }}</span>
      </div>
      <sc-if value="{{ hasGuard }}" hint-placeholder-val="{{ false }}">
        <div aria-label="Salvo {{ guardText }}" style="height: 40px; padding: 0 12px 0 5px; border-radius: 20px; display: flex; align-items: center; gap: 6px; background: linear-gradient(180deg, #fff1a8, #ffc93a 55%, #e8900f); box-shadow: 0 0 0 2px #6b2e05; animation: bnPop .4s ease-out;">
          <img src="assets/fingo/coin.webp" alt="" style="width: 30px; height: 30px;">
          <span style="font-size: 20px; font-weight: 800; line-height: 1; color: #3a1400; font-variant-numeric: tabular-nums;">{{ guardText }}</span>
        </div>
      </sc-if>
      <sc-if value="{{ showSaveLeft }}" hint-placeholder-val="{{ false }}">
        <div aria-label="Faltam {{ saveLeft }} placas para salvar" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #6cf0b0, #1fae6e); box-shadow: 0 0 0 2px #0b5a38, 0 0 12px rgba(46,207,138,.6);">
          <span style="font-size: 20px; font-weight: 800; line-height: 1; color: #ffffff; font-variant-numeric: tabular-nums; text-shadow: 0 1px 0 #0b5a38;">{{ saveLeft }}</span>
        </div>
      </sc-if>
    </div>

    <sc-if value="{{ showDragHand }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; z-index: 10; left: 0; right: 0; top: 640px; height: 70px; display: flex; justify-content: center; pointer-events: none;">
        <div style="width: 62px; height: 62px; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 0 0 8px rgba(255,255,255,.25), 0 4px 10px rgba(0,0,0,.4); animation: bnHand 1.8s ease-in-out infinite;"></div>
      </div>
    </sc-if>
    <sc-if value="{{ goldShow }}" hint-placeholder-val="{{ false }}">

        <div style="height: 64px; padding: 0 24px 0 10px; border-radius: 32px; display: flex; align-items: center; gap: 10px; background: linear-gradient(180deg, #fff1a8, #ffc93a 55%, #e8900f); box-shadow: 0 4px 0 #8a4a05, 0 0 0 2px #6b2e05, 0 0 30px rgba(255,210,87,.8);">
          <img src="assets/fingo/coin.webp" alt="" style="width: 46px; height: 46px;">
          <span style="font-size: 34px; font-weight: 800; line-height: 1; color: #3a1400; font-variant-numeric: tabular-nums;">{{ goldText }}</span>
        </div>
      </div>
    </sc-if>

    <!-- antes de começar: aposta + mão mostrando arrastar -->
    <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; z-index: 10; left: 0; right: 0; top: 640px; height: 70px; display: flex; justify-content: center; pointer-events: none;">
        <div style="width: 62px; height: 62px; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 0 0 8px rgba(255,255,255,.25), 0 4px 10px rgba(0,0,0,.4); animation: bnHand 1.8s ease-in-out infinite;"></div>
      </div>
      <div style="position: absolute; z-index: 10; left: 0; right: 0; top: 724px; display: flex; justify-content: center; pointer-events: none;">
        <div onClick="{{ openBet }}" role="button" aria-label="Aposta {{ betText }}" style="pointer-events: auto; height: 56px; padding: 0 20px 0 8px; border-radius: 28px; display: flex; align-items: center; gap: 8px; cursor: pointer; background: rgba(12,3,24,.85); box-shadow: inset 0 0 0 2px #f0b41f; animation: {{ betAnim }};" style-active="transform: scale(.95);">
          <img src="assets/fingo/coin.webp" alt="" style="width: 40px; height: 40px;">
          <span style="font-size: 28px; font-weight: 800; line-height: 1; color: #fff3c4; font-variant-numeric: tabular-nums;">{{ betText }}</span>
          <span style="font-size: 20px; line-height: 1; color: #ffd257;">✎</span>
        </div>
      </div>
    </sc-if>

    <!-- PEGAR -->
    <sc-if value="{{ showCollect }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; z-index: 12; left: 0; right: 0; top: 702px; height: 86px; display: flex; justify-content: center; pointer-events: none; animation: bnPop .3s ease-out;">
        <div onClick="{{ collectBtn }}" role="button" aria-label="Pegar {{ collectText }} moedas" style="pointer-events: auto; position: relative; overflow: hidden; width: 300px; height: 80px; border-radius: 30px; display: flex; align-items: center; justify-content: center; gap: 14px; cursor: pointer; opacity: {{ collectOp }}; background: linear-gradient(180deg, #fff1a8 0%, #ffc93a 50%, #e8900f 100%); box-shadow: 0 6px 0 #8a4a05, inset 0 2px 0 rgba(255,255,255,.6), 0 0 0 3px #6b2e05, 0 0 30px rgba(255,190,60,.5);" style-active="transform: translateY(4px); box-shadow: 0 2px 0 #8a4a05, 0 0 0 3px #6b2e05;">
          <img src="assets/fingo/coin.webp" alt="" style="width: 50px; height: 50px;">
          <span style="font-size: 42px; font-weight: 800; line-height: 1; color: #3a1400; font-variant-numeric: tabular-nums;">{{ collectText }}</span>
          <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 60px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.5), rgba(255,255,255,0)); animation: bnShine 2.4s ease-in-out infinite; pointer-events: none;"></div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ lost }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; z-index: 9; left: 0; top: 0; width: 453px; height: 802px; background: rgba(120,10,20,.28); pointer-events: none; animation: bnFade .2s ease-out;"></div>
    </sc-if>

    <sc-if value="{{ betOpen }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: -400px; right: -400px; top: -400px; bottom: -400px; z-index: 40; background: rgba(10,2,20,.72); animation: bnFade .2s ease-out;">
        <div onClick="{{ closeBet }}" role="button" style="position: absolute; inset: 0; cursor: pointer;"></div>
        <div style="position: absolute; left: 428px; top: 760px; width: 397px; padding: 22px 0 20px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; gap: 18px; background: linear-gradient(180deg, #7a2bb8, #3a0d62); box-shadow: 0 0 0 4px #f0b41f, 0 0 0 8px #6b2e05, 0 20px 40px rgba(0,0,0,.6); animation: bnPop .3s ease-out;">
          <div style="display: flex; align-items: center; justify-content: center; gap: 14px;">
            <div onClick="{{ betDown }}" role="button" aria-label="Diminuir aposta" style="width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 44px; font-weight: 800; line-height: 1; color: #6b2e05; background: linear-gradient(180deg, #fff3c4, #f0b41f 55%, #c27a0a); box-shadow: 0 0 0 3px #6b2e05, 0 6px 0 #4a1a00; opacity: {{ downOp }};" style-active="transform: translateY(4px);">−</div>
            <div style="width: 170px; height: 78px; border-radius: 39px; display: flex; align-items: center; justify-content: center; background: #2a0a4a; box-shadow: inset 0 3px 6px rgba(0,0,0,.6), 0 0 0 3px #c8871a;">
              <span style="font-size: 40px; font-weight: 800; line-height: 1; color: #fff3c4; font-variant-numeric: tabular-nums;">{{ betText }}</span>
            </div>
            <div onClick="{{ betUp }}" role="button" aria-label="Aumentar aposta" style="width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 44px; font-weight: 800; line-height: 1; color: #6b2e05; background: linear-gradient(180deg, #fff3c4, #f0b41f 55%, #c27a0a); box-shadow: 0 0 0 3px #6b2e05, 0 6px 0 #4a1a00; opacity: {{ upOp }};" style-active="transform: translateY(4px);">+</div>
          </div>
          <div onClick="{{ closeBet }}" role="button" style="padding: 12px 64px; border-radius: 999px; cursor: pointer; background: linear-gradient(180deg, #6cf096, #2ec962 60%, #22a650); box-shadow: 0 5px 0 #147a36; font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 #147a36;" style-active="transform: translateY(3px);">OK</div>
        </div>
      </div>
    </sc-if>

    <x-import from="./ui/menu.js" component="MenuPanel" dc-props="{{ menuProps }}"></x-import>

    <sc-if value="{{ win }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ closeWin }}" role="button" style="position: absolute; left: -400px; right: -400px; top: -400px; bottom: -400px; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(12,2,24,.72); animation: bnFade .2s ease-out;">
        <div style="width: 320px; padding: 26px 22px 22px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; gap: 12px; background: linear-gradient(180deg, #7a2bb8, #3a0d62); box-shadow: 0 0 0 4px #f0b41f, 0 0 0 8px #6b2e05, 0 20px 40px rgba(0,0,0,.6); animation: bnPop .45s cubic-bezier(.2,1.4,.4,1);">
          <span style="font-family: 'Rammetto One', 'Baloo 2', sans-serif; font-size: 28px; color: #ffd257; text-shadow: 0 3px 0 #6b2e05; white-space: nowrap;">{{ winTitle }}</span>
          <span style="font-size: 60px; font-weight: 800; line-height: 1; color: #fff3c4; font-variant-numeric: tabular-nums; text-shadow: 0 3px 0 #6b2e05;">{{ winText }}</span>
          <div style="margin-top: 8px; padding: 12px 60px; border-radius: 999px; background: linear-gradient(180deg, #6cf096, #2ec962 60%, #22a650); box-shadow: 0 5px 0 #147a36; font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 #147a36;">OK</div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ broke }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: -400px; right: -400px; top: -400px; bottom: -400px; z-index: 28; background: rgba(10,2,20,.6); pointer-events: none; animation: rcFade .2s ease-out;">
        <div onClick="{{ recharge }}" role="button" aria-label="Recarregar saldo" style="pointer-events: auto; width: max-content; position: absolute; left: 626px; top: 772px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 26px; border-radius: 16px; background: linear-gradient(180deg, rgba(58,6,84,.96), rgba(26,3,44,.96)); border: 3px solid #f0b41f; box-shadow: 0 10px 30px rgba(0,0,0,.6); cursor: pointer;" style-active="transform: translateX(-50%) scale(.96);">
          <div style="font-size: 13px; font-weight: 800; letter-spacing: 1.5px; white-space: nowrap; color: #ffd257;">SALDO ESGOTADO</div>
          <div style="padding: 8px 22px; border-radius: 18px; background: linear-gradient(180deg, #3ddc6d, #0a6b30); border: 2px solid #ffd257; font-size: 15px; font-weight: 800; letter-spacing: 1.5px; color: #fff8dc;">RECARREGAR</div>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
// Fortune Bounce — bola neon quica por placas; cada placa +0,1 no multiplicador (x1,1, x1,2, …, sem teto).
// Só habilidade decide a queda. A sorte sorteia a dificuldade das placas à frente (visível); rampa mais suave (máx. perto da 60ª); placas que andam só a partir da 13ª.
// Placa dourada (1 em 40) garante o valor. Retorno depende do jogador (não é fixo): calibrar frequência de placas difíceis e rampa com testes.
const BETS = [1, 2.5, 5, 10, 25, 50, 100, 250, 500, 1000];
const SKEY = 'fortuneCircus.slot.v3', BKEY = 'fortuneCircus.bounce.v1', NOTES = [523, 587, 659, 784, 880];
const fmt = n => (Math.round(n * 100) / 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const multOf = n => Math.round((1 + 0.05 * n) * 100) / 100, SAVE = 10, GOLD = 3;
class Component extends DCLogic {
  state = { balance: 1000, betIdx: 3, n: 0, guard: 0, active: false, roundBet: 0, vw: 453, vh: 802 };
  stageRef = React.createRef();
  componentDidMount() {
    this._rs = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight }); this._rs(); window.addEventListener('resize', this._rs);
    window.__bounce=this;const cloud=window.KingRicoCloud;
    if(cloud?.enabled) this._unwatchCloud=cloud.watch(p=>{this._cloudDeferred=p;if(!this._request) this.applyCloudPlayer();});
    window.bounceHooks = { onStart: () => this.onStart(), onLand: (n, g, p, st, sv) => this.onLand(n, g, p, st, sv), onSteam: () => this.onSteam(), onDrag: () => this.setState({ dragged: true }), onFall: () => this.onFall(), onStopped:()=>this.collect(multOf(this.state.n),'VOCÊ GANHOU!') };
  }
  componentWillUnmount() {this._unwatchCloud?.();clearTimeout(this._restore);if(window.__bounce===this){delete window.__bounce;delete window.bounceHooks;}window.removeEventListener('resize', this._rs); clearTimeout(this._t); }
  save() {const s=this.state;window.KingRicoCloud?.settings({sfxLvl:s.sfxLvl ?? 2,vibLvl:s.vibLvl ?? 2,bounceBetIdx:s.betIdx});}
  applyCloudPlayer() {
    const p=this._cloudDeferred;if(!p || this._request) return;this._cloudDeferred=null;const r=p.bounceRound;
    const restore=!!r && (!this.state.active || this.state.n!==r.n || this.state.roundId!==r.id);
    this.setState({balance:p.balance,sfxLvl:p.settings.sfxLvl,vibLvl:p.settings.vibLvl,betIdx:r ? BETS.indexOf(r.betUnits/100) : p.settings.bounceBetIdx ?? 3,
      active:!!r,roundId:r?.id || null,roundBet:(r?.betUnits || 0)/100,n:r?.n || 0,guard:r?.guardUnits ? r.guardUnits/r.betUnits : 0});
    if(restore) this.restoreRenderer(r.n);
  }
  restoreRenderer(n) {clearTimeout(this._restore);if(window.Bounce3D) window.Bounce3D.restore(n);else this._restore=setTimeout(()=>this.restoreRenderer(n),100);}
  async commit(move,gold=false) {const c=window.KingRicoCloud;if(this._request || !c?.enabled || !c.player) return null;this._request=true;
    try {const r=await c.bounce(move,move==='start' ? BETS[this.state.betIdx] : this.state.roundBet,this.state.roundId || crypto.randomUUID(),this.state.n,gold);return r;}
    catch(e){this._cloudDeferred=c.player;c.error(e);return null;}
    finally {this._request=false;}
  }
  ac() { if (!this._ac) { try { this._ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (this._ac.state === 'suspended') this._ac.resume(); return this._ac; }
  tone(f, d, type = 'triangle', g = 0.07, f2) { const L = [0, 0.35, 1][this.state.sfxLvl ?? 2]; if (!L) return; g *= L; const a = this.ac(); if (!a) return; const o = a.createOscillator(), v = a.createGain(), t = a.currentTime; o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(v).connect(a.destination); o.start(t); o.stop(t + d + 0.02); }
  lv() { return [0, 0.35, 1][this.state.sfxLvl ?? 2]; }
  bell(freq, dur, vol, when) { const L = this.lv(), ac = this.ac(); if (!L || !ac) return; const t = ac.currentTime + (when || 0), car = ac.createOscillator(), mod = ac.createOscillator(), mg = ac.createGain(), g = ac.createGain();
    car.type = 'sine'; car.frequency.value = freq; mod.type = 'sine'; mod.frequency.value = freq * 2.74; mg.gain.setValueAtTime(freq * 1.5, t); mg.gain.exponentialRampToValueAtTime(freq * 0.04, t + dur * 0.55); mod.connect(mg); mg.connect(car.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * L, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); car.connect(g); g.connect(ac.destination); car.start(t); mod.start(t); car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05); }
  pluck(freq, vol, dur, when) { const L = this.lv(), ac = this.ac(); if (!L || !ac) return; const t = ac.currentTime + (when || 0), o = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = freq; o2.type = 'sine'; o2.frequency.value = freq * 2; const g2 = ac.createGain(); g2.gain.value = 0.28; f.type = 'lowpass'; f.frequency.setValueAtTime(freq * 6, t); f.frequency.exponentialRampToValueAtTime(freq * 1.6, t + dur * 0.7);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * L, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(ac.destination); o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05); }
  buzz(p) { const L = this.state.vibLvl ?? 2; if (!L) return; try { navigator.vibrate && navigator.vibrate(L === 1 ? [].concat(p).map(x => Math.max(10, x >> 1)) : p); } catch (e) {} }
  busy() { const s = this.state; return this._request || s.win || s.menu || s.betOpen || s.paying; }
  async onStart() {if(this.busy()) return false;if(this.state.active) return true;
    const r=await this.commit('start');if(!r) return false;
    this._cloudDeferred=null;this.setState({balance:r.player.balance,active:true,roundId:r.outcome.roundId,roundBet:r.outcome.betUnits/100,n:0,guard:0,lost:false});this.tone(440,.08,'square',.05);return true;
  }
  async onLand(n, gold, perfect, streak, save) {const r=await this.commit('land',gold);if(!r) return false;this._cloudDeferred=null;this.setState({balance:r.player.balance});const s = this.state, bet = s.roundBet, guard = save ? multOf(n) : s.guard; this.setState({ n, guard, perf: perfect ? streak : 0, perfKey: perfect ? 'p' + n : s.perfKey });
    // frase musical de 10 placas: 9 notas que sobem e criam expectativa (a 9ª é a sensível, pede resolução) + a verde RESOLVE na tônica.
      // Cada frase muda de tom (I → IV → V → I), então a música avança junto com o jogo. Dourada = a nota da vez com oitava acima (brilho, mesmo instrumento).
      const PH = [261.63, 293.66, 329.63, 392, 440, 392, 440, 493.88, 587.33], KEY = [1, 4 / 3, 3 / 2, 1][Math.floor((n - 1) / SAVE) % 4], pos = (n - 1) % SAVE, f = (pos < 9 ? PH[pos] : 523.25) * KEY * (KEY > 1.2 ? 0.75 : 1);
      if (save) { this.pluck(f, 0.12, 0.9); this.pluck(f * 1.5, 0.055, 0.9, 0.04); this.pluck(f * 2, 0.04, 0.9, 0.08); }
      else if (gold) { this.pluck(f, 0.1, 0.5); this.pluck(f * 2, 0.07, 0.55, 0.07); this.pluck(f * 3, 0.035, 0.5, 0.14); }
      else this.pluck(f, 0.11, 0.45); this.buzz(gold || save ? [40, 30, 60] : perfect ? [12, 25, 12] : 15);
    if (perfect) this.pluck(f * 2, 0.05, 0.35, 0.05);
    
    if(gold){const w=r.outcome.winUnits/100;clearTimeout(this._gt);this.setState({goldShow:true,goldKey:'g'+n,goldText:'+'+fmt(w)});this._gt=setTimeout(()=>this.setState({goldShow:false}),1400);}
    if(r.outcome.ended){this.setState({active:false,paying:true,win:{w:r.outcome.winUnits/100,title:'VOCÊ GANHOU!'}});return false;}return true;
  }
  onSteam() { this.tone(900, 0.5, 'sawtooth', 0.04, 120); this.buzz([30, 20, 60]); }
  async onFall() {if(!this.state.active) return;const r=await this.commit('fall');if(!r) return;this._cloudDeferred=null;
    if(r.outcome.winUnits>0){this.setState({balance:r.player.balance,active:false,paying:true,win:{w:r.outcome.winUnits/100,title:'SALVO!'}});return;}
    this.setState({balance:r.player.balance,active:false,lost:true,roundId:null});this._t=setTimeout(()=>{this.setState({lost:false,n:0,guard:0});window.Bounce3D?.reset();},700);
  }
  collectBtn = () => { const s = this.state; if (!s.active || s.n < 1 || s.win || s.stopping) return; this.tone(900, 0.05, 'square', 0.05); this.buzz(20); this.setState({ stopping: true }); window.Bounce3D && window.Bounce3D.stop(); };
  async collect(mult,title) {const r=await this.commit('collect');if(!r) return;this._cloudDeferred=null;this.setState({balance:r.player.balance,active:false,stopping:false,paying:true,win:{w:r.outcome.winUnits/100,title}});}
  closeWin = () => {if(!this.state.win || this._paying) return;this._paying=true;this.setState({win:null});this.flyCoins(()=>{this._paying=false;this.setState({paying:false,n:0,guard:0,roundId:null});window.Bounce3D?.reset();this._cloudDeferred=window.KingRicoCloud.player;this.applyCloudPlayer();});};
  flyCoins(done) { const st = this.stageRef.current; if (!st || !st.animate) return done(); const from = { x: 226, y: 742 }, to = { x: 40, y: 42 }, n = 10;
    for (let i = 0; i < n; i++) { const c = document.createElement('img'); c.src = 'assets/fingo/coin.webp';
      c.style.cssText = 'position:absolute;z-index:35;left:0;top:0;width:34px;height:34px;pointer-events:none;filter:drop-shadow(0 0 8px rgba(255,210,87,.8))'; st.appendChild(c);
      const dx = (i - n / 2) * 14, mid = { x: (from.x + to.x) / 2 + dx * 3, y: from.y - 260 - (i % 3) * 30 };
      const a = c.animate([{ transform: `translate(${from.x - 17 + dx}px,${from.y - 17}px) scale(.6)`, opacity: 0 }, { transform: `translate(${mid.x - 17}px,${mid.y - 17}px) scale(1.15)`, opacity: 1, offset: .45 }, { transform: `translate(${to.x - 17}px,${to.y - 17}px) scale(.7)`, opacity: 1 }], { duration: 760, delay: i * 55, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
      a.onfinish = () => { c.remove(); this.tone(1800 + i * 40, 0.03, 'square', 0.03); if (i === n - 1) done(); }; } }
  openMenu = () => { if (this.state.active) return; this.tone(900, 0.04, 'square', 0.04); this.setState({ menu: true }); };
  closeMenu = () => this.setState({ menu: false });
  setLvl(k, v) { this.setState({ [k]: v }, () => { this.save(); if (k === 'sfxLvl') this.tone(1000, 0.05, 'square', 0.05); else this.buzz(35); }); }
  openBet = () => { if (this.state.active) return; this.tone(900, 0.04, 'square', 0.04); this.setState({ betOpen: true }); };
  closeBet = () => this.setState({ betOpen: false });
  betDown = () => { this.tone(900, 0.04, 'square', 0.04); this.buzz(15); this.setState(s => ({ betIdx: Math.max(0, s.betIdx - 1) }), () => this.save()); };
  betUp = () => { this.tone(1100, 0.04, 'square', 0.04); this.buzz(15); this.setState(s => ({ betIdx: Math.min(BETS.length - 1, s.betIdx + 1) }), () => this.save()); };
  goHome = e => { if (this.state.active && e) e.preventDefault(); };
  recharge = async () => { const cloud = window.KingRicoCloud;
    if (cloud && cloud.enabled) { try { const r = await cloud.recharge(); this.setState({ balance: r.player.balance }); } catch (e) { cloud.error && cloud.error(e); } return; }
    this.setState({ balance: 1000 }, () => this.save(1000)); };
  rcBroke() { const s = this.state; return s.balance < 1 && !s.win && !s.menu && !s.active && !s.paying; }
  renderVals() {
    const s = this.state, txt = fmt(s.balance), m = multOf(s.n);
    return {
      menuButton:{onClick:this.openMenu,disabled:!!(s.active || this._request),style:{zIndex:25}},
      menuProps:{open:!!s.menu,onClose:this.closeMenu,screen:'Fortune Bounce',details:'Deslize para cair nas plataformas. Cada salto aumenta o multiplicador; a cada 10 saltos o valor fica garantido. Placas douradas pagam x3. A aposta, as placas e os prêmios ficam salvos na conta.',sfxLvl:s.sfxLvl ?? 2,vibLvl:s.vibLvl ?? 2,onSfx:v=>this.setLvl('sfxLvl',v),onVib:v=>this.setLvl('vibLvl',v)},
      scale: Math.min(s.vw / 453, s.vh / 802), stageRef: this.stageRef, balanceText: txt, balanceSize: (txt.length <= 6 ? 19 : txt.length <= 8 ? 16.5 : 14) + 'px',
      goHome: this.goHome, openMenu: this.openMenu, closeMenu: this.closeMenu, menu: !!s.menu,
      perfShow: s.perf > 0 && s.active, perfKey: s.perfKey || 'p0', perfText: s.perf > 1 ? 'PERFEITO ×' + s.perf : 'PERFEITO!', multText: 'x' + fmt(m), multOp: s.n ? 1 : 0.45, multKey: 'm' + s.n, hasGuard: !!s.guard, guardText: fmt(s.roundBet * s.guard),
      idle: !s.active && !s.win && !s.paying && !s.lost, betText: fmt(BETS[s.betIdx]), betAnim: s.noMoney ? 'bnNo .6s ease-in-out' : 'none', openBet: this.openBet,
      betOpen: !!s.betOpen, closeBet: this.closeBet, betDown: this.betDown, betUp: this.betUp, downOp: s.betIdx === 0 ? 0.45 : 1, upOp: s.betIdx === BETS.length - 1 ? 0.45 : 1,
      showCollect: false, showSaveLeft: s.active, saveLeft: String(SAVE - (s.n % SAVE)), showDragHand: s.active && !s.dragged && s.n < 3, goldShow: !!s.goldShow, goldKey: s.goldKey || 'g0', goldText: s.goldText || '', collectOp: s.stopping ? 0.6 : 1, collectText: fmt(s.roundBet * m), collectBtn: this.collectBtn, lost: !!s.lost,
      ...[0, 1, 2].reduce((o, i) => { const on = k => (s[k] ?? 2) === i; o['sfx' + i] = () => this.setLvl('sfxLvl', i); o['vib' + i] = () => this.setLvl('vibLvl', i); o['sfxB' + i] = on('sfxLvl') ? '#ffd257' : 'transparent'; o['sfxC' + i] = on('sfxLvl') ? '#4a1a00' : '#e8d4ff'; o['vibB' + i] = on('vibLvl') ? '#ffd257' : 'transparent'; o['vibC' + i] = on('vibLvl') ? '#4a1a00' : '#e8d4ff'; return o; }, {}),
      win: !!s.win, winTitle: s.win ? s.win.title : '', winText: s.win ? '+' + fmt(s.win.w) : '', closeWin: this.closeWin,
      broke: this.rcBroke(), recharge: this.recharge
    };
  }
}
