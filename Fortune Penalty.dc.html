<script type="text/x-dc" data-dc-script>
// Fortune Penalty — 5 pênaltis: x1,2 → x1,8 → x3 → x5 → x10 (chance do chute bom: 82 → 67 → 60 → 60 → 50%). Errou perde tudo; PEGAR quando quiser.
// Chance de chegar ao degrau k = T / M[k] → parar em qualquer degrau devolve T = 98% (quando o chute vai no gol).
// Habilidade manda: chute pra fora/na trave por mira = erro de verdade. O "roubo" é sutil: chute bom na hora de errar → girafa defende (ou trave, se foi perto dela).
const M = [1.2, 1.8, 3, 5, 10], T = 0.98;
const G = { l: 40, r: 413, top: 346, line: 505 }, B0 = { x: 226, y: 640 }, BS = 64;
const PIV = { x: 226, y: 515 }, LEN = 194; const KC = { w: 152, h: 160 }, KD = { w: 250, h: 107 }, KU = { w: 98, h: 200 }, GD = { x: -105, y: 17 }, GU = -85, KS = { x: 226, y: 505 - 77 }, GLOVE = 70; // luva no mergulho: 78px do centro, na altura do centro
const BETS = [1, 2.5, 5, 10, 25, 50, 100, 250, 500, 1000];
const SKEY = 'fortuneCircus.slot.v3', PKEY = 'fortuneCircus.penalty.v1';
const fmt = n => (Math.round(n * 100) / 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const CONF = ['#ffd257', '#e8352b', '#2ec962', '#7fcfff', '#fff3c4', '#c86bff'];
const bez = (a, b, c, t) => ({ x: (1 - t) * (1 - t) * a.x + 2 * (1 - t) * t * b.x + t * t * c.x, y: (1 - t) * (1 - t) * a.y + 2 * (1 - t) * t * b.y + t * t * c.y });
function drawBall() {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S; const x = c.getContext('2d'), R = S / 2 - 4, C = S / 2;
  x.save(); x.beginPath(); x.arc(C, C, R, 0, Math.PI * 2); x.clip();
  x.fillStyle = '#fbfbf8'; x.fillRect(0, 0, S, S);
  const pent = (cx, cy, r, rot) => { x.beginPath(); for (let i = 0; i < 5; i++) { const a = rot + i * Math.PI * 2 / 5; x[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * r, cy + Math.sin(a) * r); } x.closePath(); x.fill(); };
  x.fillStyle = '#1b1b22'; pent(C, C, R * 0.3, -Math.PI / 2);
  x.strokeStyle = '#1b1b22'; x.lineWidth = 4;
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 5, a2 = a + Math.PI / 5;
    x.beginPath(); x.moveTo(C + Math.cos(a) * R * 0.3, C + Math.sin(a) * R * 0.3); x.lineTo(C + Math.cos(a) * R * 0.62, C + Math.sin(a) * R * 0.62); x.stroke();
    pent(C + Math.cos(a2) * R * 0.98, C + Math.sin(a2) * R * 0.98, R * 0.3, a2 + Math.PI); }
  const sh = x.createRadialGradient(C - R * 0.35, C - R * 0.4, R * 0.1, C, C, R); sh.addColorStop(0, 'rgba(255,255,255,.55)'); sh.addColorStop(0.55, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(20,20,40,.45)');
  x.fillStyle = sh; x.fillRect(0, 0, S, S); x.restore();
  x.beginPath(); x.arc(C, C, R, 0, Math.PI * 2); x.lineWidth = 3; x.strokeStyle = 'rgba(0,0,0,.35)'; x.stroke();
  return c.toDataURL('image/png');
}
class Component extends DCLogic {
  state = { balance: 1000, betIdx: 3, step: 0, roundBet: 0, flying: false, touched: false, idle: false, win: null, conf: [], gol: false, noMoney: false, vw: 453, vh: 802, ballSrc: '' };
  stageRef = React.createRef(); ballRef = React.createRef(); spinRef = React.createRef(); shadowRef = React.createRef(); netRef = React.createRef();
  kcRef = React.createRef(); klRef = React.createRef(); krRef = React.createRef(); kshRef = React.createRef();
  cloudLocked() { return this._cloudRequest || this.state.flying || this.state.paying || !!this.state.win; }
  componentDidUpdate() { if(this._cloudDeferred && !this.cloudLocked()) this.applyCloudPlayer(); }
  applyCloudPlayer() {
    const p=this._cloudDeferred;if(!p) return;this._cloudDeferred=null;
    const r=p.penaltyRound;
    this.setState({balance:p.balance,sfxLvl:p.settings.sfxLvl,vibLvl:p.settings.vibLvl,
      betIdx:r ? BETS.indexOf(r.betUnits/100) : p.settings.penaltyBetIdx ?? 3,
      roundId:r?.id || null,step:r?.step || 0,roundBet:r ? r.betUnits/100 : 0});
  }
  componentDidMount() {
    this._rs = () => this.setState({ vw: window.innerWidth, vh: (window.KingRicoViewport?.height ?? window.innerHeight) }); this._rs(); window.addEventListener('resize', this._rs);
    const cloud=window.KingRicoCloud;
    if(cloud?.enabled) this._unwatchCloud=cloud.watch(p=>{this._cloudDeferred=p;if(!this.cloudLocked()) this.applyCloudPlayer();});
    if(!cloud?.enabled) {
    try { const sv = JSON.parse(localStorage.getItem(SKEY)); if (sv && typeof sv.balance === 'number') this.setState({ balance: sv.balance, sfxLvl: sv.sfxLvl ?? 2, vibLvl: sv.vibLvl ?? 2 }); } catch (e) {}
    try { const h = JSON.parse(localStorage.getItem(PKEY)); if (h) this.setState({ betIdx: h.betIdx ?? 3, touched: !!h.touched, step: h.step ?? 0, roundBet: h.roundBet ?? 0 }); } catch (e) {}
    }
    this.armIdle(); this.drawNet(); window.__pen = this;
    window.penHooks = { getStep: () => this.state.step, onSwipe: q => this.onSwipe(q), onResult: g => this.result(g), sfx: (k, a) => this.sfx(k, a) };
  }
  drawNet() { const cv = this.netRef.current; if (!cv) return; const x = cv.getContext('2d'), k = 2, ox = 20, oy = 330; x.setTransform(k, 0, 0, k, -ox * k, -oy * k);
    const F = { l: 34, r: 419, t: 340, b: 505 }, Bk = { l: 64, r: 389, t: 356, b: 490 };
    x.fillStyle = 'rgba(16,4,30,.42)'; x.fillRect(F.l, F.t, F.r - F.l, F.b - F.t);
    const quad = (A, B, C, D, nu, nv, a) => { x.strokeStyle = 'rgba(255,255,255,' + a + ')'; x.lineWidth = 0.9; const L = (P, Q, s) => ({ x: P.x + (Q.x - P.x) * s, y: P.y + (Q.y - P.y) * s });
      for (let i = 0; i <= nu; i++) { const s = i / nu, p = L(A, B, s), q = L(D, C, s); x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(q.x, q.y); x.stroke(); }
      for (let i = 0; i <= nv; i++) { const s = i / nv, p = L(A, D, s), q = L(B, C, s); x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(q.x, q.y); x.stroke(); } };
    const P = (a, b) => ({ x: a, y: b });
    quad(P(Bk.l, Bk.t), P(Bk.r, Bk.t), P(Bk.r, Bk.b), P(Bk.l, Bk.b), 36, 15, .38);
    quad(P(F.l, F.t), P(Bk.l, Bk.t), P(Bk.l, Bk.b), P(F.l, F.b), 4, 17, .46);
