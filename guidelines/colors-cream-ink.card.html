<!-- @dsCard group="Colors" viewport="700x150" name="Cream & ink" subtitle="Reel faces, panels, and the brown type that sits on them" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Cream & ink</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div class="row"><div class="sw"><div class="chip" style="background:var(--fc-cream-100)"></div><span class="nm">cream-100</span><span class="hx">#FFF8EA</span></div><div class="sw"><div class="chip" style="background:var(--fc-cream-200)"></div><span class="nm">cream-200</span><span class="hx">#F6E8CF</span></div><div class="sw"><div class="chip" style="background:var(--fc-cream-300)"></div><span class="nm">cream-300</span><span class="hx">#E8D3AE</span></div><div class="sw"><div class="chip" style="background:var(--fc-ink-500)"></div><span class="nm">ink-500</span><span class="hx">#8C3A1E</span></div><div class="sw"><div class="chip" style="background:var(--fc-ink-700)"></div><span class="nm">ink-700</span><span class="hx">#6C1F10</span></div><div class="sw"><div class="chip" style="background:var(--fc-ink-900)"></div><span class="nm">ink-900</span><span class="hx">#4A1208</span></div></div></body>
</html>
