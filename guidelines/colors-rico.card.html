<!-- @dsCard group="Colors" viewport="700x150" name="King Rico" subtitle="Mascot-only ramp — never a UI surface" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Rico</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div class="row"><div class="sw"><div class="chip" style="background:var(--fc-rico-600)"></div><span class="nm">rico-600</span><span class="hx">#4B39B8</span></div><div class="sw"><div class="chip" style="background:var(--fc-rico-500)"></div><span class="nm">rico-500</span><span class="hx">#6E5BE6</span></div><div class="sw"><div class="chip" style="background:var(--fc-rico-400)"></div><span class="nm">rico-400</span><span class="hx">#8E7DF2</span></div><div class="sw"><div class="chip" style="background:var(--fc-rico-tusk)"></div><span class="nm">rico-tusk</span><span class="hx">#FAF4EC</span></div><div class="sw"><div class="chip" style="background:var(--fc-blue-500)"></div><span class="nm">blue-500</span><span class="hx">#2FA8E8</span></div><div class="sw"><div class="chip" style="background:var(--fc-blue-300)"></div><span class="nm">blue-300</span><span class="hx">#7FD8FF</span></div></div></body>
</html>
