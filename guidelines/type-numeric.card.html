<!-- @dsCard group="Type" viewport="700x170" name="Numerics" subtitle="Tabular, gold or win-green, always on a dark plaque" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Numerics</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div class="row" style="gap:16px;align-items:center">
  <span style="font:var(--fc-weight-black) 29px/1 var(--fc-font-numeric);font-variant-numeric:tabular-nums;color:var(--fc-gold-500);text-shadow:var(--fc-text-shadow-ink)">1.000</span>
  <span style="font:var(--fc-weight-black) 24px/1 var(--fc-font-numeric);color:var(--fc-win);text-shadow:var(--fc-text-shadow-win)">+250</span>
  <span style="font:var(--fc-weight-black) 23px/1 var(--fc-font-numeric);color:var(--fc-ink-700);background:var(--fc-grad-gold);padding:4px 14px;border-radius:999px">8.420</span>
</div>
<div class="hx" style="margin-top:12px">Value 24px · Title 29px · Display 34px — never below 23px inside the game frame.</div></body>
</html>
