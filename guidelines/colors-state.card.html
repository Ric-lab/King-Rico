<!-- @dsCard group="Colors" viewport="700x150" name="State colors" subtitle="Win, lock, CTA and danger" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>States</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div class="row"><div class="sw"><div class="chip" style="background:var(--fc-win)"></div><span class="nm">win</span><span class="hx">#7AE26E</span></div><div class="sw"><div class="chip" style="background:var(--fc-cta)"></div><span class="nm">cta</span><span class="hx">#1FA84A</span></div><div class="sw"><div class="chip" style="background:var(--fc-cta-deep)"></div><span class="nm">cta-deep</span><span class="hx">#0B6B2E</span></div><div class="sw"><div class="chip" style="background:var(--fc-lock)"></div><span class="nm">lock</span><span class="hx">#78FFAA</span></div><div class="sw"><div class="chip" style="background:var(--fc-danger)"></div><span class="nm">danger</span><span class="hx">#E0243C</span></div><div class="sw"><div class="chip" style="background:var(--fc-text-muted)"></div><span class="nm">muted</span><span class="hx">#B79AD6</span></div></div></body>
</html>
