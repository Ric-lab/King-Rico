<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Purple</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div class="row"><div class="sw"><div class="chip" style="background:var(--fc-purple-900)"></div><span class="nm">purple-900</span><span class="hx">#16042A</span></div><div class="sw"><div class="chip" style="background:var(--fc-purple-800)"></div><span class="nm">purple-800</span><span class="hx">#1D0733</span></div><div class="sw"><div class="chip" style="background:var(--fc-purple-700)"></div><span class="nm">purple-700</span><span class="hx">#2B0A4D</span></div><div class="sw"><div class="chip" style="background:var(--fc-purple-600)"></div><span class="nm">purple-600</span><span class="hx">#35085C</span></div><div class="sw"><div class="chip" style="background:var(--fc-purple-500)"></div><span class="nm">purple-500</span><span class="hx">#4A1076</span></div><div class="sw"><div class="chip" style="background:var(--fc-purple-400)"></div><span class="nm">purple-400</span><span class="hx">#5A1290</span></div><div class="sw"><div class="chip" style="background:var(--fc-purple-300)"></div><span class="nm">purple-300</span><span class="hx">#7B2FBF</span></div></div></body>
</html>
