<!-- @dsCard group="Type" viewport="700x150" name="Labels & captions" subtitle="Uppercase, 1.2px tracking, gold-200 at 75%" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Labels</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div class="row" style="gap:22px;align-items:center">
  <span style="font:var(--fc-weight-bold) 13px/1 var(--fc-font-ui);letter-spacing:1.2px;text-transform:uppercase;color:var(--fc-gold-200);opacity:.75">APOSTA</span>
  <span style="font:var(--fc-weight-bold) 13px/1 var(--fc-font-ui);letter-spacing:1.2px;text-transform:uppercase;color:var(--fc-gold-200);opacity:.75">SALDO</span>
  <span style="font:var(--fc-weight-bold) 11px/1 var(--fc-font-ui);letter-spacing:1.2px;text-transform:uppercase;color:var(--fc-gold-200);opacity:.75">MAX</span>
  <span style="font:var(--fc-weight-bold) 11px/1 var(--fc-font-ui);letter-spacing:1.2px;text-transform:uppercase;color:var(--fc-text-muted)">OFF</span>
</div></body>
</html>
