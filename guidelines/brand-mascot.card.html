<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Mascot</title>
<link rel="stylesheet" href="../styles.css" />
<style>

</head>
<body>
<div class="row" style="align-items:flex-end;gap:20px">
  <img src="../assets/brand/king-rico-hero.png" alt="King Rico hero" style="width:170px;height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))" />
  <img src="../assets/brand/king-rico-sitting.png" alt="King Rico sentado" style="width:190px;height:auto" />
  <img src="../assets/brand/king-rico-turnaround.png" alt="King Rico turnaround" style="width:200px;height:auto;background:#fff;border-radius:8px" />
