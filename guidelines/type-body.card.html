<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Body</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div style="background:var(--fc-surface-panel);color:var(--fc-ink-900);padding:16px 18px;border-radius:14px;max-width:420px">
  <h3 style="margin:0 0 6px;font:var(--fc-weight-black) 18px/1.2 var(--fc-font-display)">Seu progresso</h3>
  <p style="margin:0;font:var(--fc-weight-regular) 16px/1.45 var(--fc-font-text)">Moedas e níveis são salvos automaticamente. A cartela em andamento não é salva.</p>
  <p style="margin:8px 0 0;font:var(--fc-weight-bold) 13px/1.4 var(--fc-font-text);color:var(--fc-ink-700)">Backup Google indisponível nesta versão.</p>
</div></body>
</html>
