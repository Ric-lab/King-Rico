<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Metal</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div class="row" style="gap:14px">
  <div style="width:150px;height:56px;border-radius:999px;background:var(--fc-grad-gold);box-shadow:var(--fc-bevel-up);border:2px solid var(--fc-gold-700)"></div>
  <div style="width:150px;height:56px;border-radius:999px;background:var(--fc-grad-cta);box-shadow:var(--fc-bevel-up);border:2px solid var(--fc-gold-600)"></div>
  <div style="width:150px;height:56px;border-radius:999px;background:var(--fc-surface-rail);box-shadow:var(--fc-bevel-down);border:2px solid var(--fc-gold-600)"></div>
  <div style="width:150px;height:56px;border-radius:14px;background:var(--fc-grad-cream);box-shadow:var(--fc-rim-cream)"></div>
</div></body>
</html>
