<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Radii</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div class="row" style="gap:14px"><div style="text-align:center"><div style="width:76px;height:56px;background:var(--fc-grad-cream);border-radius:6px"></div><span class="nm">cell</span><span class="hx">6px</span></div><div style="text-align:center"><div style="width:76px;height:56px;background:var(--fc-grad-cream);border-radius:10px"></div><span class="nm">sm</span><span class="hx">10px</span></div><div style="text-align:center"><div style="width:76px;height:56px;background:var(--fc-grad-cream);border-radius:14px"></div><span class="nm">md</span><span class="hx">14px</span></div><div style="text-align:center"><div style="width:76px;height:56px;background:var(--fc-grad-cream);border-radius:18px"></div><span class="nm">lg</span><span class="hx">18px</span></div><div style="text-align:center"><div style="width:76px;height:56px;background:var(--fc-grad-cream);border-radius:999px"></div><span class="nm">pill</span><span class="hx">999px</span></div></div></body>
</html>
