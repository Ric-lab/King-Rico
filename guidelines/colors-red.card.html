<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Red</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div class="row"><div class="sw"><div class="chip" style="background:var(--fc-red-700)"></div><span class="nm">red-700</span><span class="hx">#7A0E1C</span></div><div class="sw"><div class="chip" style="background:var(--fc-red-600)"></div><span class="nm">red-600</span><span class="hx">#A3121F</span></div><div class="sw"><div class="chip" style="background:var(--fc-red-500)"></div><span class="nm">red-500</span><span class="hx">#C8102E</span></div><div class="sw"><div class="chip" style="background:var(--fc-red-400)"></div><span class="nm">red-400</span><span class="hx">#E0243C</span></div><div class="sw"><div class="chip" style="background:var(--fc-red-300)"></div><span class="nm">red-300</span><span class="hx">#F2596A</span></div></div></body>
</html>
