<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base — 4 / 8 / 12 / 16 / 20 / 24 / 32 / 40" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Spacing</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div class="row" style="align-items:flex-end"><div style="text-align:center"><div style="width:4px;height:4px;background:var(--fc-gold-400);border-radius:3px"></div><span class="hx" style="margin-top:6px">4</span></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--fc-gold-400);border-radius:3px"></div><span class="hx" style="margin-top:6px">8</span></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--fc-gold-400);border-radius:3px"></div><span class="hx" style="margin-top:6px">12</span></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--fc-gold-400);border-radius:3px"></div><span class="hx" style="margin-top:6px">16</span></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--fc-gold-400);border-radius:3px"></div><span class="hx" style="margin-top:6px">20</span></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--fc-gold-400);border-radius:3px"></div><span class="hx" style="margin-top:6px">24</span></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--fc-gold-400);border-radius:3px"></div><span class="hx" style="margin-top:6px">32</span></div><div style="text-align:center"><div style="width:40px;height:40px;background:var(--fc-gold-400);border-radius:3px"></div><span class="hx" style="margin-top:6px">40</span></div></div></body>
</html>
