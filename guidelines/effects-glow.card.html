<!-- @dsCard group="Spacing" viewport="700x180" name="State glows" subtitle="Win gold · lock green · near-miss red" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Glows</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div class="row" style="gap:18px"><div style="text-align:center"><div style="width:96px;height:94px;border-radius:6px;background:var(--fc-grad-cream);animation:fcWin .7s ease-in-out infinite"></div><span class="nm">win</span></div><div style="text-align:center"><div style="width:96px;height:94px;border-radius:6px;background:var(--fc-grad-cream);animation:fcLock 1s ease-in-out infinite"></div><span class="nm">lock</span></div><div style="text-align:center"><div style="width:96px;height:94px;border-radius:6px;background:var(--fc-grad-cream);animation:fcAntic .45s ease-in-out infinite"></div><span class="nm">antic</span></div><div style="text-align:center"><div style="width:96px;height:94px;border-radius:6px;background:var(--fc-grad-cream);animation:fcRing 1.2s ease-in-out infinite"></div><span class="nm">ring</span></div></div></body>
</html>
