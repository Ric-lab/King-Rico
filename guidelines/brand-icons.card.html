<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Icons</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div class="row" style="gap:18px;align-items:center">
  <img src="../assets/icons/btn-home.png" alt="Início" style="width:64px;height:64px" />
  <img src="../assets/icons/btn-menu.png" alt="Menu" style="width:64px;height:64px" />
  <span class="hx" style="max-width:420px">Only two icons exist as artwork today. Everything else is a typographic glyph on the gold coin face (＋ − ⚡ ▶) — see readme ICONOGRAPHY.</span>
</div></body>
</html>
