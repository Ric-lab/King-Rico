<!-- @dsCard group="Colors" viewport="700x150" name="Gold" subtitle="Every frame, rim, bulb and number" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Gold</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div class="row"><div class="sw"><div class="chip" style="background:var(--fc-gold-700)"></div><span class="nm">gold-700</span><span class="hx">#8F5A0A</span></div><div class="sw"><div class="chip" style="background:var(--fc-gold-600)"></div><span class="nm">gold-600</span><span class="hx">#C77A16</span></div><div class="sw"><div class="chip" style="background:var(--fc-gold-500)"></div><span class="nm">gold-500</span><span class="hx">#FDAB1E</span></div><div class="sw"><div class="chip" style="background:var(--fc-gold-400)"></div><span class="nm">gold-400</span><span class="hx">#F0B41F</span></div><div class="sw"><div class="chip" style="background:var(--fc-gold-300)"></div><span class="nm">gold-300</span><span class="hx">#FFD257</span></div><div class="sw"><div class="chip" style="background:var(--fc-gold-200)"></div><span class="nm">gold-200</span><span class="hx">#FFE58A</span></div><div class="sw"><div class="chip" style="background:var(--fc-gold-100)"></div><span class="nm">gold-100</span><span class="hx">#FFF3C4</span></div></div></body>
</html>
