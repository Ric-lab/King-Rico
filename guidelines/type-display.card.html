<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Display</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background: var(--fc-purple-800); font-family: var(--fc-font-ui); color: var(--fc-text-on-dark); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { width:104px; }
  .chip { height:56px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nm { display:block; font:var(--fc-weight-bold) 11px/1.4 var(--fc-font-ui); letter-spacing:.3px; margin-top:6px; color:var(--fc-cream-100); }
  .hx { display:block; font:var(--fc-weight-regular) 10px/1.3 var(--fc-font-text); color:var(--fc-text-muted); }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:10px">
  <span style="font:var(--fc-weight-black) 34px/1 var(--fc-font-display);color:var(--fc-gold-300);text-shadow:var(--fc-text-shadow-ink)">MEGA WIN 12.500</span>
  <span style="font:var(--fc-weight-black) 29px/1 var(--fc-font-display);color:var(--fc-cream-100)">Aposta 1.000</span>
  <span style="font:var(--fc-weight-bold) 24px/1 var(--fc-font-display);color:var(--fc-cream-100)">Girar de novo</span>
  <span class="hx">Baloo 2 · 800 / 700 · leading 1 · tracking .5px</span>
</div></body>
</html>
