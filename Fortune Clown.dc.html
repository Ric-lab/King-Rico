<helmet>
<style>
@font-face { font-family: 'Baloo 2'; font-weight: 400 800; font-display: swap; src: url('assets/fonts/baloo2-latin.woff2') format('woff2'); }
@font-face { font-family: 'Rammetto One'; font-display: swap; src: url('assets/fonts/rammettoone-latin.woff2') format('woff2'); }
html, body { margin: 0; height: 100%; background: #12051f; font-family: 'Baloo 2', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
a { color: #ffd257; text-decoration: none; } a:hover { color: #fff1b8; }

@keyframes ckHand { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 75% { transform: translateY(-170px); opacity: 1; } 100% { transform: translateY(-190px); opacity: 0; } }

</style>

<div style="position: fixed; inset: 0; display: flex; justify-content: center; overflow: hidden; background: #2a0a4a;">

          <div style="padding: 10px 56px; border-radius: 999px; background: linear-gradient(180deg, #6cf096, #2ec962); box-shadow: 0 5px 0 #147a36; font-size: 24px; font-weight: 800; color: #fff;">OK</div>
        </div>
      </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
// Fortune Clown — a "boca do palhaço" com swipe. 5 bolas por aposta; cada bola vale aposta/5 × buraco.
// Habilidade: a bola vai exatamente onde o dedo parou (e faz o arco do dedo). Errou o buraco = não pontua.
// Sorte: bola dentro do buraco entra com chance 0,95/x (senão bate na borda e sai) → retorno ≤ 95% mesmo para quem acerta sempre.
const HOLES = [ // rosto 440px; área generosa: boca conta lábio e língua, olho conta a lente, nariz conta a bola vermelha
  { n: 'boca', x: 226.5, y: 436, rx: 92, ry: 50, m: 1.5 }, { n: 'nariz', x: 225.6, y: 353.6, rx: 30, ry: 30, m: 2.5 },
  { n: 'olho', x: 174.9, y: 293.4, rx: 28, ry: 28, m: 5 }, { n: 'olho', x: 276.4, y: 293.4, rx: 28, ry: 28, m: 5 },
  { n: 'orelha', x: 84.7, y: 376.8, rx: 22, ry: 24, m: 10 }, { n: 'orelha', x: 365.7, y: 376.8, rx: 22, ry: 24, m: 10 }];
const BALLS = 5, BETS = [1, 2.5, 5, 10, 25, 50, 100, 250, 500, 1000], SKEY = 'fortuneCircus.slot.v3', B0 = { x: 226, y: 670 };
const fmt = n => (Math.round(n * 100) / 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
class Component extends DCLogic {
  state = { balance: 1000, betIdx: 3, left: BALLS, sum: 0, active: false, busy: false, results: [], vw: 453, vh: 802 };
  faceRef = React.createRef(); stageRef = React.createRef(); ballRef = React.createRef(); boardRef = React.createRef(); trailRef = React.createRef();
  componentDidMount() { this._rs = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight }); this._rs(); window.addEventListener('resize', this._rs);
    try { const sv = JSON.parse(localStorage.getItem(SKEY)); if (sv && typeof sv.balance === 'number') this.setState({ balance: sv.balance }); } catch (e) {} this.setBall(B0.x, B0.y, 1, 1); this.off = 0; this.amp = 0;
    const sw = now => { const n = this.state.results.length, A = this.state.active && n >= 2 ? 22 + (n - 2) * 16 : 0; this.amp += (A - this.amp) * 0.04; this.off = Math.sin(now / 1000 * 1.7) * this.amp; const f = this.faceRef.current; if (f) f.style.transform = 'translateX(' + this.off.toFixed(1) + 'px)'; this._sw = requestAnimationFrame(sw); }; this._sw = requestAnimationFrame(sw); }
  componentWillUnmount() { window.removeEventListener('resize', this._rs); cancelAnimationFrame(this._raf); cancelAnimationFrame(this._sw); }
  react(h) { const b = this.boardRef.current, f = this.faceRef.current; if (!b || !b.animate) return;
    if (h.n === 'boca') { b.animate([0, 1, 0, 1, 0, 1, 0].map(k => ({ transform: k ? 'scale(1.03, .95)' : 'scale(1)' })), { duration: 720, easing: 'ease-in-out' }); [0, 240, 480].forEach(d => setTimeout(() => this.tone(140, 0.08, 'sine', 0.1, 90), d)); }
    else if (h.n === 'nariz') { b.animate([{ transform: 'scale(1)' }, { transform: 'scale(.97) translateY(4px)', offset: .45 }, { transform: 'scale(1.08) translateY(-10px)', offset: .6 }, { transform: 'scale(1)' }], { duration: 700 }); setTimeout(() => this.tone(900, 0.25, 'sawtooth', 0.05, 200), 380); }
    else if (h.n === 'olho') { const lid = f && f.querySelector('[data-lid="' + (h.x < 226 ? 0 : 1) + '"]'); if (lid && lid.animate) lid.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)', offset: .3 }, { transform: 'scaleY(1)', offset: .65 }, { transform: 'scaleY(0)' }], { duration: 650 }); this.tone(1500, 0.08, 'triangle', 0.06, 2200); }
    else { const s = h.x < 226 ? 1 : -1; b.animate([0, 1, -1, 1, -1, 0].map(k => ({ transform: 'rotate(' + (k * s * 3) + 'deg)' })), { duration: 600, easing: 'ease-in-out' }); [0, 120, 240].forEach(d => setTimeout(() => this.tone(1100, 0.05, 'square', 0.04), d)); } }
  openMenu = () => this.setState({ menu: true }); closeMenu = () => this.setState({ menu: false });
  save(b) { try { const sv = JSON.parse(localStorage.getItem(SKEY)) || {}; sv.balance = b; localStorage.setItem(SKEY, JSON.stringify(sv)); } catch (e) {} }
  ac() { if (!this._ac) try { this._ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } if (this._ac.state === 'suspended') this._ac.resume(); return this._ac; }
  tone(f, d, type = 'triangle', g = 0.07, f2) { const a = this.ac(); if (!a) return; const o = a.createOscillator(), v = a.createGain(), t = a.currentTime; o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(v).connect(a.destination); o.start(t); o.stop(t + d + 0.02); }
  buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  setBall(x, y, k, op) { this._bq = [x, y, k, op]; const B = window.ClownBall; if (B) B.set(x, y, k, op); else if (!this._bw) { this._bw = setInterval(() => { if (window.ClownBall) { clearInterval(this._bw); this._bw = null; window.ClownBall.set(...this._bq); } }, 100); } }
  // marca de tinta onde a bola bateu (fica ~3 s e some); desenhada no rosto, então balança junto
  splat(x, y, col) { const f = this.faceRef.current; if (!f) return; this._spl = this._spl || {}; let u = this._spl[col];
    if (!u) { const c = document.createElement('canvas'); c.width = c.height = 120; const g = c.getContext('2d'); g.fillStyle = col; g.beginPath(); g.arc(60, 60, 26, 0, 7); g.fill();
      for (let i = 0; i < 11; i++) { const a = i / 11 * 6.28 + Math.random() * 0.4, d = 26 + Math.random() * 22, r = 4 + Math.random() * 7; g.beginPath(); g.arc(60 + Math.cos(a) * d, 60 + Math.sin(a) * d, r, 0, 7); g.fill(); g.lineWidth = r * 1.2; g.strokeStyle = col; g.beginPath(); g.moveTo(60, 60); g.lineTo(60 + Math.cos(a) * d, 60 + Math.sin(a) * d); g.stroke(); }
      g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.arc(50, 48, 12, 0, 7); g.fill(); u = this._spl[col] = c.toDataURL(); }
    const im = document.createElement('img'); im.src = u; im.style.cssText = 'position:absolute;left:' + (x - this.off - 30) + 'px;top:' + (y - 30) + 'px;width:60px;height:60px;pointer-events:none;transform:rotate(' + Math.round(Math.random() * 360) + 'deg)'; f.appendChild(im);
    if (im.animate) { im.animate([{ transform: im.style.transform + ' scale(.2)' }, { transform: im.style.transform + ' scale(1.1)', offset: .1 }, { transform: im.style.transform + ' scale(1)', offset: .2 }, { transform: im.style.transform + ' scale(1)' }], { duration: 3200 }); im.animate([{ opacity: 1 }, { opacity: 1, offset: .75 }, { opacity: 0 }], { duration: 3200 }).onfinish = () => im.remove(); } else setTimeout(() => im.remove(), 3200); }
  pt(e) { const r = this.stageRef.current.getBoundingClientRect(), s = r.width / 453; return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s }; }
  anim(T, f, done) { const t0 = performance.now(); const st = () => { const k = Math.min(1, (performance.now() - t0) / T); f(k); if (k < 1) this._raf = requestAnimationFrame(st); else done && done(); }; this._raf = requestAnimationFrame(st); }
  stop = e => e.stopPropagation();
  down = e => { const s = this.state; if (s.busy || s.win || s.menu) return; this.ac(); try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {} const p = this.pt(e); this.drag = { pts: [p] }; };
  move = e => { const d = this.drag; if (!d) return; const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : []; for (const ev of (evs.length ? evs : [e])) d.pts.push(this.pt(ev)); this.drawTrail(); };
  up = e => { const d = this.drag; if (d && e && e.clientX != null) d.pts.push(this.pt(e)); this.drag = null; this.clearTrail(); if (!d || d.pts.length < 2) return; const a = d.pts[0], z = d.pts[d.pts.length - 1]; if (a.y - z.y < 60) return; this.shoot(d.pts); };
  drawTrail() { const c = this.trailRef.current, P = this.drag && this.drag.pts; if (!c || !P) return; const x = c.getContext('2d'); x.setTransform(2, 0, 0, 2, 0, 0); x.clearRect(0, 0, 453, 802); x.lineCap = 'round'; x.strokeStyle = 'rgba(255,236,170,.6)'; x.lineWidth = 10; x.beginPath(); P.forEach((p, i) => i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y)); x.stroke(); }
  clearTrail() { const c = this.trailRef.current; if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height); }
  shoot(P) {
    const s = this.state; let bal = s.balance, active = s.active, bet = BETS[s.betIdx];
    if (!active) { if (bal < bet) { this.buzz([40, 80, 40]); this.tone(200, 0.25, 'sine', 0.1, 140); return; } bal = Math.round((bal - bet) * 100) / 100; active = true; this.save(bal); }
    this.setState({ balance: bal, active, busy: true, touched: true });
    const a = P[0], z = P[P.length - 1], T = { x: z.x, y: z.y }, L = [0]; for (let i = 1; i < P.length; i++) L.push(L[i - 1] + Math.hypot(P[i].x - P[i - 1].x, P[i].y - P[i - 1].y));
    const tot = L[L.length - 1] || 1, chord = Math.hypot(z.x - a.x, z.y - a.y) || 1, sc = Math.hypot(T.x - B0.x, T.y - B0.y) / chord;
    const devAt = u => { const want = u * tot; let i = 1; while (i < L.length - 1 && L[i] < want) i++; const f = (want - L[i - 1]) / ((L[i] - L[i - 1]) || 1), qx = P[i - 1].x + (P[i].x - P[i - 1].x) * f, qy = P[i - 1].y + (P[i].y - P[i - 1].y) * f;
      return { x: qx - (a.x + (z.x - a.x) * u), y: qy - (a.y + (z.y - a.y) * u) }; };
    let maxDev = 0; for (let i = 0; i <= 10; i++) { const dv = devAt(i / 10); maxDev = Math.max(maxDev, Math.hypot(dv.x, dv.y)); } const curve = maxDev > 6;
    const path = t => { const dv = curve ? devAt(t) : { x: 0, y: 0 }; return { x: B0.x + (T.x - B0.x) * t + dv.x * sc, y: B0.y + (T.y - B0.y) * t + dv.y * sc - 70 * Math.sin(Math.PI * t) }; };
    const kEnd = 0.4; this.ci = ((this.ci ?? -1) + 1) % 5; const col = (window.ClownBallColors || ['#ff3b8a'])[this.ci]; if (window.ClownBall) window.ClownBall.setColor(this.ci);
    this.tone(180, 0.12, 'sine', 0.12, 90); this.buzz(25);
    this.anim(650, k => { const q = path(k); this.setBall(q.x, q.y, 1 + (kEnd - 1) * k, 1); }, () => {
      const off = this.off, hole = HOLES.find(h => ((T.x - h.x - off) / h.rx) ** 2 + ((T.y - h.y) / h.ry) ** 2 <= 1), inn = hole && Math.random() < 0.95 / hole.m;
      if (inn) { this.react(hole); this.anim(260, k => this.setBall(T.x + (hole.x + off - T.x) * k, T.y + (hole.y - T.y) * k, kEnd * (1 - k * 0.8), 1 - k), () => this.score(hole));
        return; }
      // bateu no rosto/borda: deixa a marca de tinta, quica e cai
      if (hole || Math.hypot(T.x - 226.5 - off, (T.y - 360) * 1.05) < 215) this.splat(T.x, T.y, col);
      this.tone(hole ? 700 : 300, 0.1, 'square', 0.05, hole ? 450 : 200); this.buzz(hole ? [20, 30, 20] : 15);
      const dir = T.x < 226 ? -1 : 1; this.anim(700, k => this.setBall(T.x + dir * 70 * k, T.y - 60 * Math.sin(k * Math.PI * 0.6) + 420 * k * k, kEnd + 0.3 * k, k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1), () => this.score(null));
    });
  }
  score(hole) {
    const s = this.state, bet = BETS[s.betIdx], w = hole ? bet / BALLS * hole.m : 0, left = s.left - 1, sum = Math.round((s.sum + w) * 100) / 100;
    if (hole) { [784, 988, 1318].forEach((f, i) => setTimeout(() => this.tone(f + hole.m * 20, 0.16), i * 70)); this.buzz([30, 30, 50]); this.setState({ floatOn: true, floatX: (hole.x + this.off) + 'px', floatY: (hole.y - 30) + 'px', floatText: '+' + fmt(w), fk: Date.now() }); setTimeout(() => this.setState({ floatOn: false }), 900); }
    this.setState({ left, sum, results: s.results.concat([hole ? hole.m : 0]) });
    if (left > 0) { setTimeout(() => { this.setBall(B0.x, B0.y, 1, 1); this.setState({ busy: false }); }, 350); return; }
    setTimeout(() => this.setState({ win: { w: sum, title: sum > 0 ? 'VOCÊ GANHOU!' : 'TENTE DE NOVO' } }), 500);
  }
  closeWin = () => { const s = this.state; const bal = Math.round((s.balance + s.win.w) * 100) / 100; this.save(bal); if (s.win.w > 0) this.tone(1320, 0.15);
    this.setState({ balance: bal, win: null, left: BALLS, sum: 0, active: false, busy: false, results: [] }); this.setBall(B0.x, B0.y, 1, 1); };
  betDown = () => { if (this.state.active) return; this.setState(s => ({ betIdx: Math.max(0, s.betIdx - 1) })); this.tone(900, 0.04, 'square', 0.04); };
  betUp = () => { if (this.state.active) return; this.setState(s => ({ betIdx: Math.min(BETS.length - 1, s.betIdx + 1) })); this.tone(1100, 0.04, 'square', 0.04); };
  renderVals() { const s = this.state;
    const bt = fmt(s.balance);
    return { faceRef: this.faceRef, menu: !!s.menu, openMenu: this.openMenu, closeMenu: this.closeMenu, balanceSize: (bt.length <= 6 ? 19 : bt.length <= 8 ? 16.5 : 14) + 'px',
      payList: [['Boca', 1.5], ['Nariz', 2.5], ['Olho', 5], ['Orelha', 10]].map(([n, m]) => ({ n, m: 'x' + fmt(m) })), scale: Math.min(s.vw / 453, s.vh / 802), stageRef: this.stageRef, ballRef: this.ballRef, boardRef: this.boardRef, trailRef: this.trailRef,
      down: this.down, move: this.move, up: this.up, stop: this.stop, balanceText: fmt(s.balance),
      balls: Array.from({ length: BALLS }, (_, i) => ({ bg: i < s.results.length ? (s.results[i] ? 'radial-gradient(circle at 35% 30%, #fff3c4, #ffd257 55%, #c27a0a)' : 'rgba(0,0,0,.35)') : 'radial-gradient(circle at 35% 30%, #ffb3a0, #e8352b 60%, #8a1010)' })),
      roundText: s.active ? '+' + fmt(s.sum) : '', tags: HOLES.map(h => ({ x: h.x + 'px', y: (h.y + h.ry + 4) + 'px', m: 'x' + fmt(h.m) })),
      floatOn: !!s.floatOn, floatX: s.floatX, floatY: s.floatY, floatText: s.floatText,
      showHand: !s.touched && !s.busy, showBet: !s.active, betText: fmt(BETS[s.betIdx]), betDown: this.betDown, betUp: this.betUp,
      win: !!s.win, winTitle: s.win ? s.win.title : '', winText: s.win ? '+' + fmt(s.win.w) : '', closeWin: this.closeWin }; }
}
