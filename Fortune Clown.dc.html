<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<x-dc>
<helmet>
<style>
@font-face { font-family: 'Baloo 2'; font-weight: 400 800; font-display: swap; src: url('assets/fonts/baloo2-latin.woff2') format('woff2'); }
@font-face { font-family: 'Rammetto One'; font-display: swap; src: url('assets/fonts/rammettoone-latin.woff2') format('woff2'); }
html, body { margin: 0; height: 100%; background: #12051f; font-family: 'Baloo 2', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
a { color: #ffd257; text-decoration: none; } a:hover { color: #fff1b8; }
@keyframes ckPop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
@keyframes ckHand { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 75% { transform: translateY(-170px); opacity: 1; } 100% { transform: translateY(-190px); opacity: 0; } }
@keyframes ckFloat { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }
</style>
</helmet>
<div style="position: fixed; inset: 0; display: flex; justify-content: center; overflow: hidden; background: #2a0a4a;">

  <div ref="{{ stageRef }}" onPointerDown="{{ down }}" onPointerMove="{{ move }}" onPointerUp="{{ up }}" onPointerCancel="{{ cancel }}" data-screen-label="Fortune Clown" style="position: relative; flex: 0 0 auto; width: 453px; height: 802px; transform: scale({{ scale }}); transform-origin: 50% 0; user-select: none; touch-action: none;">
    <div class="kr-hud-balance" role="status" aria-label="Seu saldo: {{ balanceText }} moedas" style="position: absolute; z-index: 20; left: 18px; top: 24px; width: 130px; height: 36px; border-radius: 18px; overflow: hidden; background-image: url('assets/stage-hd-c.webp'); background-size: 453px 802px; background-position: -19.333px -30px; background-repeat: no-repeat; transform: scale(1.25); transform-origin: 0 50%;">
      <div style="position: absolute; left: 39px; top: -2px; width: 88px; height: 39px; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: {{ balanceSize }}; font-weight: 800; color: #662c2c; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; transform: translateY(.05em);"><x-import from="./ui/wallet-value.js" component="WalletValue" dc-props="{{ walletProps }}"></x-import></span>
      </div>
    </div>
    <a href="Home.dc.html" onPointerDown="{{ stop }}" aria-label="Voltar para o início" class="kr-hud-home" style="z-index: 20; cursor: pointer; border-radius: 50%; overflow: hidden; " style-active="filter: brightness(.6) saturate(1.2);"></a>
    <x-import from="./ui/menu.js" component="MenuButton" dc-props="{{ menuButton }}"></x-import>

    <div style="position: absolute; left: 50%; top: 110px; transform: translateX(-50%); padding: 7px 10px; border-radius: 22px; display: flex; justify-content: center; gap: 6px; background: #fffaf0; box-shadow: inset 0 -3px 0 rgba(160,110,40,.25), 0 0 0 2px #f0b41f, 0 4px 10px rgba(0,0,0,.35);">
      <sc-for list="{{ balls }}" as="b" hint-placeholder-count="5">
        <div style="position: relative; width: 30px; height: 30px; border-radius: 50%; box-shadow: {{ b.sh }}; transform: scale({{ b.k }}); transition: transform .2s;"><sc-if value="{{ b.img }}" hint-placeholder-val="{{ false }}"><x-import from="./ui/clown-marker.js" component="ClownMarker" dc-props="{{ b.markerProps }}"></x-import></sc-if><sc-if value="{{ b.miss }}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(20,4,36,.55); font-size: 22px; font-weight: 800; line-height: 1; color: #ff4d4d; text-shadow: 0 1px 0 #fff;">✕</div></sc-if></div>
      </sc-for>
    </div>
    <div style="position: absolute; left: 0; right: 0; top: 76px; text-align: center; font-size: 26px; font-weight: 800; color: #ffd257; text-shadow: 0 2px 0 #6b2e05; font-variant-numeric: tabular-nums;">{{ roundText }}</div>

    <sc-for list="{{ tags }}" as="t" hint-placeholder-count="6">
      <div class="ck-multiplier" aria-label="{{ t.label }}" style="position: absolute; left: {{ t.x }}; top: {{ t.y }}; transform: translateX(-50%); padding: 1px 6px; border-radius: 10px; background: rgba(28,6,48,.7); font-size: 15px; font-weight: 800; color: #ffd257; pointer-events: none;">{{ t.m }}</div>
    </sc-for>
    <div data-lid="0" style="position: absolute; z-index: 3; left: 155px; top: 273.4px; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(180deg, #ff7ab8, #ffb03a); box-shadow: inset 0 -4px 0 #fff3c4, 0 0 0 3px #ffd23a; transform: scaleY(0); transform-origin: 50% 0;"></div>
    <div data-lid="1" style="position: absolute; z-index: 3; left: 256.4px; top: 273.4px; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(180deg, #5ad8ff, #a45cff); box-shadow: inset 0 -4px 0 #fff3c4, 0 0 0 3px #2ec4d6; transform: scaleY(0); transform-origin: 50% 0;"></div>
    <div data-lid="nose" style="position: absolute; z-index: 3; left: 205.6px; top: 333.6px; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(180deg, #ff5a4a, #d81e1e); box-shadow: inset 0 -4px 0 #ff9a8a; transform: scaleY(0); transform-origin: 50% 0;"></div>

    <sc-if value="{{ floatOn }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; z-index: 9; left: {{ floatX }}; top: {{ floatY }}; transform: translateX(-50%); font-size: 30px; font-weight: 800; color: #fff3c4; text-shadow: 0 2px 0 #6b2e05; animation: ckFloat .9s ease-out forwards; pointer-events: none;">{{ floatText }}</div>
    </sc-if>

    <x-import component-from-global-scope="clown-ball" from="./clownball.js" style="position: absolute; z-index: 8; left: 0; top: 0; width: 453px; height: 802px; pointer-events: none;" hint-size="453px,802px"></x-import>
    <canvas ref="{{ trailRef }}" width="906" height="1604" style="position: absolute; z-index: 7; inset: 0; width: 453px; height: 802px; pointer-events: none;"></canvas>
    <sc-if value="{{ showHand }}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; z-index: 9; left: 197px; top: 650px; width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 0 0 8px rgba(255,255,255,.3); pointer-events: none; animation: ckHand 1.6s ease-in-out infinite;"></div>
    </sc-if>

    <sc-if value="{{ showBet }}" hint-placeholder-val="{{ true }}">
      <div onPointerDown="{{ stop }}" style="position: absolute; z-index: 25; left: 0; right: 0; top: 724px; display: flex; align-items: center; justify-content: center; gap: 14px;">
        <div onPointerDown="{{ stop }}" onClick="{{ betDown }}" role="button" aria-label="Diminuir aposta" class="kr-stepper" style="display: flex; align-items: center; justify-content: center; cursor: pointer; --kr-step-size:54px;">−</div>

      </div>

    <x-import from="./ui/menu.js" component="MenuPanel" dc-props="{{ menuProps }}"></x-import>
    <sc-if value="{{ broke }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: -400px; right: -400px; top: -400px; bottom: -400px; z-index: 28; background: rgba(10,2,20,.6); pointer-events: none; animation: rcFade .2s ease-out;">
        <div onPointerDown="{{ stop }}" onClick="{{ recharge }}" role="button" aria-label="Recarregar saldo" style="pointer-events: auto; width: max-content; position: absolute; left: 626px; top: 772px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 26px; border-radius: 16px; background: linear-gradient(180deg, rgba(58,6,84,.96), rgba(26,3,44,.96)); border: 3px solid #f0b41f; box-shadow: 0 10px 30px rgba(0,0,0,.6); cursor: pointer;" style-active="transform: translateX(-50%) scale(.96);">
          <div style="font-size: 13px; font-weight: 800; letter-spacing: 1.5px; white-space: nowrap; color: #ffd257;">SALDO ESGOTADO</div>
          <div style="padding: 8px 22px; border-radius: 18px; background: linear-gradient(180deg, #3ddc6d, #0a6b30); border: 2px solid #ffd257; font-size: 15px; font-weight: 800; letter-spacing: 1.5px; color: #fff8dc;">RECARREGAR</div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ win }}" hint-placeholder-val="{{ false }}">
      <div onPointerDown="{{ stop }}" onClick="{{ closeWin }}" role="button" style="position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(12,2,24,.72);">
        <div style="width: 300px; padding: 24px 20px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; gap: 12px; background: linear-gradient(180deg, #7a2bb8, #3a0d62); box-shadow: 0 0 0 4px #f0b41f, 0 0 0 8px #6b2e05; animation: ckPop .4s ease-out;">
          <span style="font-family: 'Rammetto One', sans-serif; font-size: 26px; color: #ffd257; text-shadow: 0 3px 0 #6b2e05;">{{ winTitle }}</span>
          <span style="font-size: 56px; font-weight: 800; line-height: 1; color: #fff3c4; font-variant-numeric: tabular-nums;">{{ winText }}</span>
          <div class="kr-button" style="padding: 10px 56px; font-size: 24px; font-weight: 800;">OK</div>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
// Fortune Clown — 10 bolas por aposta; cada bola vale aposta/10 × buraco.
// Habilidade: a bola vai exatamente onde o dedo parou (e faz o arco do dedo). Errou o buraco = não pontua.
// Mira e esquiva preservam o design. Cada resultado é confirmado na conta antes da animação.
const HOLES = [ // rosto 440px; área generosa: boca conta lábio e língua, olho conta a lente, nariz conta a bola vermelha
  { n: 'boca', x: 226.5, y: 442, rx: 98, ry: 60, m: 1.5 }, { n: 'nariz', x: 225.6, y: 353.6, rx: 30, ry: 30, m: 2.5 },
  { n: 'olho', x: 174.9, y: 293.4, rx: 28, ry: 28, m: 5 }, { n: 'olho', x: 276.4, y: 293.4, rx: 28, ry: 28, m: 5 },
  { n: 'orelha', x: 84.7, y: 376.8, rx: 22, ry: 24, m: 10 }, { n: 'orelha', x: 365.7, y: 376.8, rx: 22, ry: 24, m: 10 }];
const BALLS = 10, BETS = [1, 2.5, 5, 10, 25, 50, 100, 250, 500, 1000], B0 = { x: 226, y: 670 };
const FACE = { x: 226.5, y: 360, drop: 24 };
const fmt = n => (Math.round(n * 100) / 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
class Component extends DCLogic {
  state = { balance: 1000, betIdx: 3, left: BALLS, sum: 0, active: false, busy: false, results: [], vw: 453, vh: 802 };
  faceRef = React.createRef(); stageRef = React.createRef(); ballRef = React.createRef(); boardRef = React.createRef(); trailRef = React.createRef();
  componentDidMount() { this._rs = () => this.setState({ vw: window.innerWidth, vh: (window.KingRicoViewport?.height ?? window.innerHeight) }); this._rs(); window.addEventListener('resize', this._rs);
    window.__clown=this;this.off=0;this.amp=0;this.setBall(B0.x,B0.y,1,1);
    const cloud=window.KingRicoCloud;
    if(cloud?.enabled) this._unwatchCloud=cloud.watch(p=>{this._cloudDeferred=p;if(!this.state.busy && !this._request) this.applyCloudPlayer();});
    const sw = now => { this.moveFace(now); this._sw = requestAnimationFrame(sw); }; this._sw = requestAnimationFrame(sw); }
  moveFace(now) {
    const n = this.state.active ? this.state.results.filter(v => v > 0).length : 0;
    const dt = this._faceTime == null ? 0 : Math.min(.05, Math.max(0, (now - this._faceTime) / 1000)); this._faceTime = now;
    if (!n) { this.amp = this.off = this.dy = this.dyT = this.angle = this.turnSpeed = 0; }
    else {
      this.amp = (this.amp || 0) + (22 + (n - 1) * 16 - (this.amp || 0)) * .04;
      this.off = Math.sin(now / 1000 * 1.7) * this.amp;
      this.dy = (this.dy || 0) + ((this.dyT || 0) - (this.dy || 0)) * .14;
      // Positive screen-space rotation is clockwise, around the face's own center.
      const speed = n >= 6 ? .35 + (n - 6) * .08 : 0;
      this.turnSpeed = (this.turnSpeed || 0) + (speed - (this.turnSpeed || 0)) * (1 - Math.exp(-dt / .3));
      this.angle = n >= 6 ? ((this.angle || 0) + this.turnSpeed * dt) % (Math.PI * 2) : 0;
    }
    const f = this.faceRef.current;
    if (f) f.style.transform = 'translate(' + this.off + 'px,' + (FACE.drop + this.dy) + 'px) rotate(' + this.angle + 'rad)';
  }
  // Same pivot and order as CSS: rotate locally, then translate. Inverse is used by aiming and paint.
  facePoint(p, inverse = false, dodge = this.dy || 0) {
    const a = (this.angle || 0) * (inverse ? -1 : 1), c = Math.cos(a), s = Math.sin(a), ox = this.off || 0;
    const x = p.x - FACE.x - (inverse ? ox : 0), y = p.y - FACE.y - (inverse ? FACE.drop + dodge : 0);
    return { x: FACE.x + x * c - y * s + (inverse ? 0 : ox), y: FACE.y + x * s + y * c + (inverse ? 0 : FACE.drop + dodge) };
  }
  componentWillUnmount() { this._dead=true;this._unwatchCloud?.();clearInterval(this._bw);if(window.__clown===this) delete window.__clown; window.removeEventListener('resize', this._rs); cancelAnimationFrame(this._raf); cancelAnimationFrame(this._sw); }
  react(h) { const b = this.boardRef.current, f = this.faceRef.current; if (!b || !b.animate) return;
    if (h.n === 'boca') { b.animate([0, 1, 0, 1, 0, 1, 0].map(k => ({ transform: k ? 'scale(1.03, .95)' : 'scale(1)' })), { duration: 720, easing: 'ease-in-out' }); [0, 240, 480].forEach(d => setTimeout(() => this.tone(140, 0.08, 'sine', 0.1, 90), d)); }
    else if (h.n === 'nariz') { const nz = f && f.querySelector('[data-lid="nose"]'); if (nz && nz.animate) nz.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)', offset: .3 }, { transform: 'scaleY(1)', offset: .65 }, { transform: 'scaleY(0)' }], { duration: 650 }); b.animate([{ transform: 'scale(1)' }, { transform: 'scale(.97) translateY(4px)', offset: .45 }, { transform: 'scale(1.08) translateY(-10px)', offset: .6 }, { transform: 'scale(1)' }], { duration: 700 }); setTimeout(() => this.tone(900, 0.25, 'sawtooth', 0.05, 200), 380); }
    else if (h.n === 'olho') { const lid = f && f.querySelector('[data-lid="' + (h.x < 226 ? 0 : 1) + '"]'); if (lid && lid.animate) lid.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)', offset: .3 }, { transform: 'scaleY(1)', offset: .65 }, { transform: 'scaleY(0)' }], { duration: 650 }); this.tone(1500, 0.08, 'triangle', 0.06, 2200); }
    else { const s = h.x < 226 ? 1 : -1; b.animate([0, 1, -1, 1, -1, 0].map(k => ({ transform: 'rotate(' + (k * s * 3) + 'deg)' })), { duration: 600, easing: 'ease-in-out' }); [0, 120, 240].forEach(d => setTimeout(() => this.tone(1100, 0.05, 'square', 0.04), d)); } }
  openMenu = () => {if(!this.state.busy && !this._request){this.cancel();this.setState({menu:true});}}; closeMenu = () => this.setState({ menu: false });
  applyCloudPlayer() {
    const p=this._cloudDeferred;if(!p) return;this._cloudDeferred=null;const r=p.clownRound;
    this.setState({balance:p.balance,betIdx:r ? BETS.indexOf(r.betUnits/100) : p.settings.clownBetIdx ?? 3,
      sfxLvl:p.settings.sfxLvl,vibLvl:p.settings.vibLvl,roundId:r?.id || null,active:!!r,
      left:BALLS-(r?.used || 0),sum:(r?.sumUnits || 0)/100,results:r?.results || []},()=>this.nextColor());
  }
  componentDidUpdate() {if(this._cloudDeferred && !this.state.busy && !this._request) this.applyCloudPlayer();}
  setLvl(k,v) {this.setState({[k]:v});window.KingRicoCloud?.settings({[k]:v});}
  recharge = async () => {const c=window.KingRicoCloud;if(this._request || !c?.enabled) return;this._request=true;try{await c.recharge();}catch(e){c.error(e);}finally{this._request=false;this.applyCloudPlayer();}};
  ac() { if (!this._ac) try { this._ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } if (this._ac.state === 'suspended') this._ac.resume(); return this._ac; }
  tone(f, d, type = 'triangle', g = 0.07, f2) { const level=[0,.35,1][this.state.sfxLvl ?? 2];if(!level) return;g*=level;const a = this.ac(); if (!a) return; const o = a.createOscillator(), v = a.createGain(), t = a.currentTime; o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(v).connect(a.destination); o.start(t); o.stop(t + d + 0.02); }
  buzz(p) {const level=this.state.vibLvl ?? 2;if(!level) return;if(level===1) p=[].concat(p).map((v,i)=>i%2 ? v : Math.max(15,Math.round(v/2)));try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  setBall(x, y, k, op) { this._bq = [x, y, k, op]; const B = window.ClownBall; if (B) B.set(x, y, k, op); else if (!this._bw) { this._bw = setInterval(() => { if (window.ClownBall && window.ClownBall.texs) { clearInterval(this._bw); this._bw = null; window.ClownBall.set(...this._bq); this.nextColor(); this.forceUpdate(); } }, 100); } }
  // marca de tinta onde a bola bateu (fica ~3 s e some); desenhada no rosto, então balança junto
  splat(x, y, col) { const f = this.faceRef.current; if (!f) return; this._spl = this._spl || {}; let u = this._spl[col];
    if (!u) { const c = document.createElement('canvas'); c.width = c.height = 120; const g = c.getContext('2d'); g.fillStyle = col; g.beginPath(); g.arc(60, 60, 26, 0, 7); g.fill();
      for (let i = 0; i < 11; i++) { const a = i / 11 * 6.28 + Math.random() * 0.4, d = 26 + Math.random() * 22, r = 4 + Math.random() * 7; g.beginPath(); g.arc(60 + Math.cos(a) * d, 60 + Math.sin(a) * d, r, 0, 7); g.fill(); g.lineWidth = r * 1.2; g.strokeStyle = col; g.beginPath(); g.moveTo(60, 60); g.lineTo(60 + Math.cos(a) * d, 60 + Math.sin(a) * d); g.stroke(); }
      g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.arc(50, 48, 12, 0, 7); g.fill(); u = this._spl[col] = c.toDataURL(); }
    const local = this.facePoint({x,y},true), im = document.createElement('img'); im.src = u; im.style.cssText = 'position:absolute;left:' + (local.x - 30) + 'px;top:' + (local.y - 30) + 'px;width:60px;height:60px;pointer-events:none;transform:rotate(' + Math.round(Math.random() * 360) + 'deg)'; f.appendChild(im);
    if (im.animate) { im.animate([{ transform: im.style.transform + ' scale(.2)' }, { transform: im.style.transform + ' scale(1.1)', offset: .1 }, { transform: im.style.transform + ' scale(1)', offset: .2 }, { transform: im.style.transform + ' scale(1)' }], { duration: 3200 }); im.animate([{ opacity: 1 }, { opacity: 1, offset: .75 }, { opacity: 0 }], { duration: 3200 }).onfinish = () => im.remove(); } else setTimeout(() => im.remove(), 3200); }
  // marcador = mesma bola (listras onduladas + brilho), desenhada em 2D
  marker(i) { const CB = window.ClownBall; if (CB && CB.snap && CB.texs) return CB.snap(i); this._mk = this._mk || []; if (this._mk[i]) return this._mk[i]; const P = [['#ff3b8a', '#ffd0e4'], ['#2fb8ff', '#d4f1ff'], ['#2ec962', '#d6ffe4'], ['#a45cff', '#ecdcff']][i], c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
    x.beginPath(); x.arc(32, 32, 31, 0, 7); x.clip(); x.fillStyle = P[0]; x.fillRect(0, 0, 64, 64); x.strokeStyle = P[1]; x.lineWidth = 6; x.lineCap = 'round';
    for (let k = 0; k < 3; k++) { x.beginPath(); for (let u = -4; u <= 68; u += 4) { const y = 14 + k * 17 + Math.sin(u / 64 * Math.PI * 2 + k) * 5; u > -4 ? x.lineTo(u, y) : x.moveTo(u, y); } x.stroke(); }
    const g = x.createRadialGradient(22, 18, 2, 32, 32, 34); g.addColorStop(0, 'rgba(255,255,255,.75)'); g.addColorStop(0.35, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,.35)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    return this._mk[i] = c.toDataURL(); }
  nextColor() { const B = window.ClownBall, n = (window.ClownBallColors || [1]).length; if (B) B.setColor(this.state.results.length % n); }
  pt(e) { const r = this.stageRef.current.getBoundingClientRect(), s = r.width / 453; return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s }; }
