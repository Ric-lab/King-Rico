<section id="kr-boot-screen" aria-label="Abrindo Fortune Circus">
  <div class="kr-boot-scene">
    <img class="kr-boot-art" src="/assets/brand/loading-king-rico.webp" alt="" fetchpriority="high" decoding="async">
    <h1 class="kr-boot-brand"><span>FORTUNE</span><strong>CIRCUS</strong></h1>
    <div class="kr-boot-status">
      <p data-boot-message role="status">Preparando seu jogo…</p>
      <div class="kr-boot-track" role="progressbar" aria-label="Carregando o jogo"><span></span></div>
      <button class="kr-boot-retry" type="button" hidden>Tentar novamente</button>
    </div>
  </div>
</section>
