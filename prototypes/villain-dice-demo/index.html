<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>King Rico — teste do dado</title><link rel="stylesheet" href="/ui/park/dice.css"><style>
@font-face{font-family:'Baloo 2';src:url('/assets/baloo2-latin.woff2') format('woff2');font-weight:400 900;font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(#34b9f2,#1394d8 65%,#66ac53);color:#fff5cf;font-family:'Baloo 2',sans-serif;display:grid;place-items:center;padding:20px}main{width:min(390px,100%);text-align:center}h1{font-size:32px;margin:0 0 8px}p{font-size:18px;line-height:1.4}label{display:block;margin-top:14px;font-size:18px}select{font:700 20px 'Baloo 2';padding:8px 14px;border:2px solid #e9b647;border-radius:12px;background:#fff1d2;color:#682c9c;width:90%;margin:4px auto 0}.park-action{display:block;min-height:54px;padding:10px 18px;margin:20px auto 0;border:2px solid #ffd56b;border-radius:20px;background:linear-gradient(#9561df,#672aa0);box-shadow:0 3px #4b1e6f;color:#fff5cf;font:800 22px 'Baloo 2';cursor:pointer}.park-action-blue{background:linear-gradient(#4a9bd5,#2463ac);box-shadow:0 3px #153e7d}.park-action:active{translate:0 2px;box-shadow:none}.park-action:disabled{opacity:.5;cursor:default}#result{min-height:28px;color:#fff;font-size:24px;font-weight:800}.note{font-size:16px;max-width:320px;margin:18px auto;opacity:.95}.park-villain-dice{background:#122e4f88}button:focus-visible,select:focus-visible{outline:3px solid white;outline-offset:4px}
</style><main><h1>King Rico</h1><p>Dado 3D por swipe</p><label for="kind">Personagem</label><select id="kind"><option value="tony">Tony Tiger</option><option value="tucker">Tucker Toucan</option><option value="ray">Ray Raccoon</option></select><label for="face">Resultado de teste</label><select id="face"><option>0</option><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select><button id="play" class="park-action">TESTAR O DADO</button><div id="result" role="status"></div><p class="note">Só demonstração. Sem apostas, carteira ou cobrança. O swipe controla o lançamento; a face final é a escolhida acima.</p></main><script type="module">
import {playVillainDie} from '/ui/park/villain-dice.js';
const play=document.querySelector('#play'),face=document.querySelector('#face'),kind=document.querySelector('#kind'),result=document.querySelector('#result');
const fc={money:n=>n.toLocaleString('pt-BR',{maximumFractionDigits:2})};
async function launch(){play.disabled=true;result.textContent='';const value=Number(face.value);try{await playVillainDie(fc,{dice:{version:1,value},stolenUnits:value*1000,stolen:value},kind.value);result.textContent=`Resultado: ${value}`;}finally{play.disabled=false;}}
play.onclick=launch;await document.fonts.ready;launch();
</script></html>
