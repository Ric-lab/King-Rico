<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="./ui/header.css"><title>Parque do King Rico</title><link rel="stylesheet" href="./ui/controls.css"><link rel="stylesheet" href="./ui/home.css"><link rel="stylesheet" href="./ui/park/park-home.css"><script defer src="/ui/park/home.js"></script></head><body class="park-home"><main class="park-home-content" data-screen-label="Parque">
<header class="park-home-header"><div class="kr-hud-row">
<div class="kr-hud-balance" role="status" aria-label="Seu saldo"><strong data-kr-wallet-value data-home-balance>0</strong></div>
<a class="kr-hud-home" data-kr-hit="" href="/circus" aria-label="Voltar ao Circus"></a>
<button class="kr-menu-button park-home-menu" data-kr-hit="" aria-label="Abrir menu"></button>
</div></header>
<button class="park-recharge" data-recharge><img src="/assets/icons/reward-video.svg" alt=""><span><strong>+1.000 moedas</strong><small>Ver anúncio de 30s</small></span><span class="park-recharge-arrow" aria-hidden="true">›</span></button>

<p class="park-entry-price"><b>1 ingresso</b><span>ou</span><b><span data-park-price>25</span> moedas</b><small>por partida</small></p>
<div class="park-grid">

<a class="park-card" href="/penalty" data-game="penalty"><div class="park-game-art park-game-art-penalty" aria-hidden="true"><i class="park-icon-goal"></i><img class="park-penalty-ball" src="/ui/park/football.svg" alt=""><img class="park-game-character" src="/assets/penalty/clown-keeper-v3.webp" alt=""></div><div class="park-card-copy"><h3>Fortune Pênalti</h3><span class="park-game-action kr-button"><span data-park-action>JOGAR</span><b aria-hidden="true">›</b></span></div></a>
<a class="park-card" href="/flying-clown" data-game="flying"><div class="park-game-art park-game-art-flying" aria-hidden="true"><svg class="park-balloon-strings" viewBox="0 0 126 75"><path d="M23 42Q26 58 63 64M63 45V64M103 42Q99 58 63 64"/></svg><span class="park-icon-balloons"><img src="/assets/flying/b0.webp" alt=""><img src="/assets/flying/b1.webp" alt=""><img src="/assets/flying/b2.webp" alt=""></span><img class="park-game-character" src="/assets/flying/clown.webp" alt=""></div><div class="park-card-copy"><h3>Flying Clown</h3><span class="park-game-action kr-button"><span data-park-action>JOGAR</span><b aria-hidden="true">›</b></span></div></a>
<a class="park-card" href="/bounce" data-game="bounce"><div class="park-game-art park-game-art-bounce" aria-hidden="true"><img class="park-card-cover" src="/ui/park/covers/bounce.svg" alt=""></div><div class="park-card-copy"><h3>Fortune Bounce</h3><span class="park-game-action kr-button"><span data-park-action>JOGAR</span><b aria-hidden="true">›</b></span></div></a>
<article class="park-card park-card-coming" aria-label="Basquete · Em breve"><div class="park-game-art" aria-hidden="true"><img class="park-card-cover" src="/ui/park/covers/basketball.svg" alt=""></div><div class="park-card-copy"><h3>Basquete</h3><span class="park-coming-label">EM BREVE</span></div></article>
<article class="park-card park-card-coming" aria-label="Bubble Plinko · Em breve"><div class="park-game-art" aria-hidden="true"><img class="park-card-cover" src="/ui/park/covers/bubble-plinko.svg" alt=""></div><div class="park-card-copy"><h3>Bubble Plinko</h3><span class="park-coming-label">EM BREVE</span></div></article>
<article class="park-card park-card-coming" aria-label="Race Horse · Em breve"><div class="park-game-art" aria-hidden="true"><img class="park-card-cover" src="/ui/park/covers/race-horse.svg" alt=""></div><div class="park-card-copy"><h3>Race Horse</h3><span class="park-coming-label">EM BREVE</span></div></article>
</div></section>

<footer>Moedas virtuais · sem dinheiro real</footer></main></body></html>
