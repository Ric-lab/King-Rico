<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="./ui/header.css"><title>Parque do King Rico</title><link rel="stylesheet" href="./ui/controls.css"><link rel="stylesheet" href="./ui/home.css"><link rel="stylesheet" href="./ui/park/park-home.css"><script defer src="/ui/park/home.js"></script></head><body class="park-home"><main class="park-home-content" data-screen-label="Parque">

<div class="park-grid">
<a class="park-card" href="/clown" data-game="clown"><div class="park-game-art park-game-art-clown" aria-hidden="true"><img class="park-game-character" src="/assets/clown/clown.webp" alt=""></div><div class="park-card-copy"><h3>Fortune Clown</h3><span class="park-card-action"><span data-park-action>JOGAR</span><b aria-hidden="true">›</b></span></div></a>
<a class="park-card" href="/penalty" data-game="penalty"><div class="park-game-art park-game-art-penalty" aria-hidden="true"><i class="park-icon-goal"></i><img class="park-game-character" src="/assets/penalty/jump.webp" alt=""></div><div class="park-card-copy"><h3>Fortune Pênalti</h3><span class="park-card-action"><span data-park-action>JOGAR</span><b aria-hidden="true">›</b></span></div></a>
<a class="park-card" href="/flying-clown" data-game="flying"><div class="park-game-art park-game-art-flying" aria-hidden="true"><span class="park-icon-balloons"><img src="/assets/flying/b0.webp" alt=""><img src="/assets/flying/b1.webp" alt=""><img src="/assets/flying/b2.webp" alt=""></span><img class="park-game-character" src="/assets/flying/clown.webp" alt=""></div><div class="park-card-copy"><h3>Flying Clown</h3><span class="park-card-action"><span data-park-action>JOGAR</span><b aria-hidden="true">›</b></span></div></a>

</div></section>
<button class="park-recharge" data-recharge><img src="/assets/icons/reward-video.svg" alt=""><span><strong>+1.000 moedas</strong><small>Ver anúncio de 30s</small></span><span class="park-recharge-arrow" aria-hidden="true">›</span></button>
<footer>Moedas virtuais · sem dinheiro real</footer></main></body></html>
