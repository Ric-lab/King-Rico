@keyframes hsScratch { 0% { transform: translate(-70px, 10px) rotate(-10deg); opacity: 0; } 15% { opacity: 1; } 50% { transform: translate(70px, -10px) rotate(10deg); } 85% { opacity: 1; } 100% { transform: translate(-70px, 10px) rotate(-10deg); opacity: 0; } }

@keyframes hsPop { 0% { transform: scale(.5); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@font-face { font-family: 'Baloo 2'; font-style: normal; font-weight: 400 800; font-display: swap; src: url('assets/fonts/baloo2-latin.woff2') format('woff2'); }
@font-face { font-family: 'Luckiest Guy'; font-style: normal; font-weight: 400; font-display: swap; src: url('assets/fonts/luckiestguy-latin.woff2') format('woff2'); }
@font-face { font-family: 'Rammetto One'; font-style: normal; font-weight: 400; font-display: swap; src: url('assets/fonts/rammettoone-latin.woff2') format('woff2'); }
html, body { margin: 0; padding: 0; background: #12051f; font-family: 'Baloo 2', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
a { color: #ffd257; text-decoration: none; } a:hover { color: #fff1b8; }
@keyframes hmShine { 0% { transform: translateX(-160%) skewX(-18deg); } 60%, 100% { transform: translateX(420%) skewX(-18deg); } }
@keyframes hmBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

      bonusBtnSh: ready ? '0 3px 0 #a86a00, inset 0 1px 0 rgba(255,255,255,.6)' : 'none',
      bonusBtnColor: ready ? '#5a2a00' : 'rgba(255,240,210,.7)',
      bonusCursor: ready ? 'pointer' : 'default',
      soon: [
        { id: 2, name: 'Bingo do Circo', img: A('assets/symbols/sym-tent.png'), c1: '#7a1c3a', c2: '#3a0b22' }
      ],
      menuButton: {onClick:this.openMenu,style:(() => {
        if (window.__fcLayout) return {};
        const gs = Math.max(.25, Math.min(window.innerWidth / 453, window.innerHeight / 802));
        return {right:(40.667*gs-20.5)+'px',top:'calc((var(--kr-hud-top) + 20.5px) * '+gs+' - 20.5px)','--kr-hud-scale':gs};
      })()},
      menuProps: {open:!!s.menu,onClose:this.closeMenu,screen:'Home',
        details:'Seu saldo é compartilhado entre todos os jogos. O bônus diário acompanha uma sequência de sete dias.',
        sfxLvl:s.sfxLvl,vibLvl:s.vibLvl,onSfx:v=>this.setLvl('sfxLvl',v),onVib:v=>this.setLvl('vibLvl',v)}
    };
  }
}
</script>
