<script type="text/x-dc" data-dc-script data-props="{&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;happy&quot;,&quot;wave&quot;,&quot;cheer&quot;,&quot;dance&quot;,&quot;tap&quot;,&quot;surprise&quot;,&quot;sad&quot;,&quot;root&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:520,&quot;min&quot;:120,&quot;max&quot;:1024,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;demo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
// King Rico — pose-to-pose cartoon animation. Every pose is a full drawing (aligned on the same feet line);

const JB = .42; // juggling beat (s)

const BACK_TO_IDLE = { wave: 2.6, surprise: 2.4, tap: 3.6 };
class Component extends DCLogic {
  state = { mood: null };
  rStage = React.createRef();
  componentDidMount() {
    this.t0 = this.mt = performance.now();

    const st0 = this.rStage.current;
    if (st0 && window.__fcAsset) st0.querySelectorAll('img').forEach(i => { const s = i.getAttribute('src'); if (s && /^assets\//.test(s)) { const u = window.__fcAsset(s); if (u && u !== s) i.src = u; } });
    if (st0) st0.querySelectorAll('img').forEach(i => { i.loading = 'eager'; i.decode && i.decode().catch(() => {}); });
    window.KingRico = { play: m => this.play(m) };
    const loop = now => { this.frame(now); this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  componentDidUpdate(pp) { if ((pp.mood !== this.props.mood || pp.moodKey !== this.props.moodKey) && this.props.mood) this.play(this.props.mood); }
  mood() { return this.state.mood || this.props.mood || 'idle'; }

  pose(t, u, m) {
    const S = Math.sin, P = Math.PI, cl = x => Math.max(0, Math.min(1, x)), ease = x => 1 - Math.pow(1 - cl(x), 3);

    // idle = one drawing only (no pose swaps → no size flicker); life comes from breathing + slight sway
    // idle = heads or tails: hold (1.4s) → flick (.2s) → watch it fly (1.6s) → catch (.6s). 3 slow pose swaps per 3.8s.
    // 0–1.2 hold · 1.2–1.4 flick · 1.4–3.0 flight · 3.0–3.4 caught high · 3.4–3.9 lower (slow dissolve + coin tween) · 3.9–4.4 hold

      f = u < 1.1 ? 'hope' : ((u - 1.1) % 3) < 1.8 ? 'look' : 'hope';
      const jit = f === 'nail' ? 1.2 * S(t * 31) : 0;
      y = -3 * Math.max(0, S(t * 7)) ; r = (f === 'look' ? 1.5 : 0) + jit; sy = 1 + .01 * S(t * 7); sx = 2 - sy;
      if (f === 'hope') { const k = Math.max(0, 1 - u / .18); sy = 1 - .04 * k; sx = 1 + .03 * k; }
    } else
    if (m === 'happy') {
      // bounce: settle (happy) ↔ lift (happy2 laughing)
      const p = (u * 1.8) % 1, h = S(p * P); f = u < .14 ? 'happyIn' : p > .2 && p < .8 ? 'happy2' : 'happy';
      y = -10 * h; sy = 1 + .02 * h - .03 * Math.max(0, 1 - p * 6); sx = 2 - sy; sh = 1 - .2 * h;
    } else if (m === 'wave') {

      // raise → ping-pong wave → lower
      const end = BACK_TO_IDLE.wave;
      if (u < .1) { f = 'happyIn'; sy = 1 - .04 * S(u / .1 * P); sx = 1 + .03 * S(u / .1 * P); }
      else if (u < .22) f = 'waveIn';
      else if (u > end - .32) f = u > end - .14 ? 'happyIn' : 'waveOut';
      else { const seq = ['wave', 'wave3', 'wave2', 'wave3'], ph = Math.floor((u - .22) / .13) % 4; f = seq[ph]; r = [1.6, 0, -1.6, 0][ph]; }
    } else if (m === 'cheer') {

      const c = 1.25, p = (u % c) / c;
      if (p < .15) { f = 'crouch2'; const k = S(p / .15 * P / 2); sy = 1 - .02 * k; sx = 1 + .015 * k; }
      else if (p < .64) {
        const a = (p - .15) / .49, h = S(a * P); y = -120 * h; sh = 1 - .55 * h; r = 2.5 * S(a * P * 2);
        f = a < .22 ? 'cheerRise' : a < .7 ? 'cheer' : 'cheerFall';
        sy = 1 + .04 * (a < .22 ? 1 - a / .22 : 0); sx = 2 - sy;
      }

      else f = 'happy2';

      const seq = ['dance1', 'danceL', 'dance3', 'danceR2', 'dance2', 'dance2b', 'dance3', 'danceL'], sides = [-1, -.5, 0, .5, 1, .5, 0, -.5];
      const beat = .17, n = Math.floor(u / beat), p = (u % beat) / beat, h = S(p * P), st = n % 8, side = sides[st];
      f = seq[st]; y = -(Math.abs(side) > .9 ? 14 : 6) * h; r = 4 * side * (1 - .4 * h);
      const land = Math.max(0, 1 - p * 5); sy = 1 - .04 * land + .015 * h; sx = 1 + .03 * land; sh = 1 - .2 * h;
    } else if (m === 'tap') {
      // raise → mid-swing → strike → hold
      const c = 1.6, p = (u % c) / c;
      if (p > .78) { f = 'tapRecover'; }
      else if (p < .26) { f = 'tapMid'; /* 'raise' frame has the scepter head cropped at the top */ const k = ease(p / .26); y = -8 * k; sy = 1 + .02 * k; sx = 1 - .015 * k; }
      else if (p < .32) { f = 'tapMid'; y = -4; }
      else { f = 'tap'; const k = Math.max(0, 1 - (p - .32) / .1); sy = 1 - .07 * k; sx = 1 + .05 * k; y = 2 * k; ring = (p - .32) / .3; }
    } else if (m === 'surprise') {
      // flinch → hop with wide eyes → settle
      if (u < .2) { f = 'startle'; const k = S(u / .2 * P / 2); sy = 1 - .05 * k; sx = 1 + .03 * k; r = -2 * k; }
      else if (u > .54 && u < .7) { f = 'surpriseLand'; const k = S((u - .54) / .16 * P); sy = 1 - .03 * k; sx = 1 + .02 * k; }
      else { f = 'surprised'; const a = (u - .2) / .34, h = a < 1 ? S(a * P) : 0; y = -55 * h; sy = 1 + .06 * h - (a >= 1 && a < 1.35 ? .07 * S((a - 1) / .35 * P) : 0); sx = 2 - sy; sh = 1 - .4 * h; r = 2.2 * S(u * 38) * Math.max(0, 1 - u * 1.4); }
    } else if (m === 'sad') {
      // deflate into a deeper slump, then sigh between the two
      f = u < .2 ? 'sadIn' : u < .55 ? 'sad' : (Math.floor((u - .55) / 1.6) % 2 ? 'sad' : 'sad2');
      const k = ease(u / .9), sb = S(t * 1.1); y = 4 * k; sy = 1 - .015 * k - .008 * sb; sx = 1 + .01 * k + .005 * sb; r = .8 * S(t * .7);
    }
    return { f, y, r, sx, sy, sh, ring };
  }
  frame(now) {
    const st = this.rStage.current; if (!st) return;
    const t = (now - this.t0) / 1000, u = (now - this.mt) / 1000, m = this.mood();
    if (BACK_TO_IDLE[m] && u > BACK_TO_IDLE[m]) { this.play('idle'); return; }
    const q = this.pose(t, u, m), W = st.clientWidth || 1, k = W / 1024;

    const dt = Math.min(.05, (now - (this._last || now)) / 1000); this._last = now;

    ['y', 'r', 'sx', 'sy', 'sh'].forEach(key => { S0[key] += (q[key] - S0[key]) * a; q[key] = S0[key]; });
    if (!this._els) { this._els = { body: st.querySelector('[data-k="body"]'), shadow: st.querySelector('[data-k="shadow"]'), ring: st.querySelector('[data-k="ring"]'), f: {} }; st.querySelectorAll('[data-f]').forEach(e => { this._els.f[e.dataset.f] = e; }); }
    const E = this._els;
    if (!E.coins) E.coins = [0, 1, 2].map(i => st.querySelector('[data-k="coin' + i + '"]'));
    E.coins.forEach((el, i) => {
      if (!el) return;
      if (i > 0 || this.mood() !== 'idle') { el.style.opacity = '0'; return; }
      const p = t % COIN_C, C = W * .065;
      let x, y, flip = 1, sc = .5; // matches the coin painted in the hand frames (~28px)
      // coin lives inside the body layer (same squash/breath as the drawing); in the hold phase it sits exactly over the painted coin
      // frames with a painted coin (hold / lowerA / lowerB) show it themselves; our coin only flies
      // big coin always visible (covers the small painted one) so it never shrinks in the hand
      sc = 1.15;
      // In-hand phases: the coin painted in the frame IS the coin (no overlay → never two coins, no erased-palm stain).
      // The animated coin exists only while the hand is empty (toss → flight → catch), timed past the .16s cross-fades.
      if (p < 1.3 || p >= 3.33) { el.style.opacity = '0'; return; }

      else if (p < 3.0) { const a = (p - 1.4) / 1.6, x0 = PALM_TOSS[0], y0 = PALM_TOSS[1], x1 = PALM_CATCH[0], y1 = PALM_CATCH[1];
        x = x0 + (x1 - x0) * a; const h = Math.min(y0, y1) - APEX; y = y0 + (y1 - y0) * a - 4 * (Math.min(y0, y1) - APEX + 0) * 0 - 4 * (Math.min(y0,y1) - APEX) * a * (1 - a) * 0;
        y = (1 - a) * (1 - a) * y0 + 2 * (1 - a) * a * (2 * APEX - (y0 + y1) / 2) + a * a * y1;
        flip = Math.cos(a * Math.PI * 9); sc = 1.15 + .45 * Math.sin(a * Math.PI); } // grows toward the apex, back to painted size in the palm
      else { [x, y] = PALM_CATCH; const s2 = Math.max(0, 1 - (p - 3.0) / .2); y += 6 * Math.sin(s2 * Math.PI); }
      el.style.opacity = '1';
      el.style.transform = `translate(${(x * W / 1024 - C / 2).toFixed(1)}px, ${(y * W / 1024 - C / 2).toFixed(1)}px) scale(${sc.toFixed(3)}, ${(sc * Math.max(.08, Math.abs(flip))).toFixed(3)})`;
      el.style.filter = flip < 0 ? 'brightness(.82)' : 'none';
      return;
      // coin i is tossed on beats n ≡ i (mod 3): flies 2.6 beats (toss tip → apex → catch scoop), then rides the trunk back up
      const u3 = ((t / JB) - i + 300) % 3, side = (Math.floor((t / JB - i + 300) / 3) + i) % 2 ? 1 : -1;
      const TX = .544, TY = .06, CX = .575, CY = .5;
      let lx, ly;
      if (u3 < 2.6) { const a = u3 / 2.6; lx = TX + (CX - TX) * a + side * .13 * Math.sin(a * Math.PI); ly = TY + (CY - TY) * a - .2 * Math.sin(a * Math.PI); }
      else { const a = (u3 - 2.6) / .4, e = a * a * (3 - 2 * a); lx = CX + (TX - CX) * e; ly = CY + (TY - CY) * e; }
      ly += (q.y * k) / W;
      el.style.opacity = '1';
      el.style.transform = 'translate(' + ((lx - .05) * W).toFixed(1) + 'px,' + ((ly - .05) * W).toFixed(1) + 'px) rotateY(' + ((t * 540 + i * 120) % 360).toFixed(0) + 'deg)';
    });
    // pose swap: tiny pop so the cut reads as a drawn key pose
    // pose swap with a 70ms dissolve: new pose underneath at full opacity, old pose fades out on top (no see-through dip)
    if (q.f !== this._cur) {
      const nw = E.f[q.f], od = this._cur && E.f[this._cur];
      Object.values(E.f).forEach(e => { if (e !== nw && e !== od) { e.style.transition = 'none'; e.style.opacity = '0'; e.style.zIndex = '0'; } });
      if (nw) { nw.style.transition = 'none'; nw.style.opacity = '1'; nw.style.zIndex = '1'; }
      if (od) { od.style.zIndex = '2'; od.style.transition = 'opacity ' + 110 + 'ms ease-out'; void od.offsetWidth; od.style.opacity = '0'; }
      this._cur = q.f; this._pop = now;
    }
    const pop = this._pop ? Math.max(0, 1 - (now - this._pop) / 120) : 0;
    E.body.style.transform = `translateY(${(q.y * k).toFixed(2)}px) rotate(${q.r.toFixed(2)}deg) scale(${q.sx.toFixed(4)}, ${q.sy.toFixed(4)})`;
    E.shadow.style.transform = `scale(${q.sh.toFixed(3)})`; E.shadow.style.opacity = (.35 + .65 * q.sh).toFixed(3);
    if (q.ring >= 0 && q.ring <= 1) { E.ring.style.opacity = (1 - q.ring).toFixed(3); E.ring.style.transform = `scale(${(.4 + 1.4 * q.ring).toFixed(3)})`; } else E.ring.style.opacity = '0';
  }
  renderVals() {
    const cur = this.mood();
    return { rStage: this.rStage, size: (this.props.size ?? 520) + 'px', demo: this.props.demo ?? true,
      moods: MOODS.map(([k, label]) => ({ label, bg: k === cur ? '#ffd257' : '#4fd97a', go: () => this.play(k) })) };
  }
}
</script>
</body>
