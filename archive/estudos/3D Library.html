const key = new THREE.DirectionalLight(0xffe8c4, 1.6); key.position.set(1.2, 2.6, 3.2); studio.add(key);

const rim = new THREE.DirectionalLight(0xfff2d8, 1.4); rim.position.set(0.4, 2.2, -3); studio.add(rim);

const cam = new THREE.PerspectiveCamera(22, 1, 0.01, 100);
