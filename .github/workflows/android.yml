name: App Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      apk:
        description: Gerar o APK de teste (publicado no branch apk-builds)
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publicar o APK no branch apk-builds
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Regras e matemática (RTP 96–99%, acerto ≥ 20%)
        run: npm run typecheck && npm test

      - name: Build offline do jogo
        run: npm run build:www

      - name: Teste de fumaça (Home + 3 giros, sem internet)
        run: npm run smoke
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome

      # APK só sob demanda (Actions → App Android → Run workflow); testes e fumaça rodam em todo push.
      - uses: actions/setup-java@v4
        if: github.event_name == 'workflow_dispatch' && inputs.apk
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: APK de teste
        if: github.event_name == 'workflow_dispatch' && inputs.apk
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.apk
        with:
          name: king-rico-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Branch órfão com só o APK mais recente (force-push: não acumula histórico).
      # Permite baixar o APK sem login no GitHub Actions e puxá-lo por git.
      - name: Publicar APK no branch apk-builds
        if: github.event_name == 'workflow_dispatch' && inputs.apk
        run: |
          out=$(mktemp -d)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$out/king-rico-teste.apk"
          cd "$out"
          printf 'APK de teste gerado a partir do commit %s (%s).\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > LEIA-ME.txt
          git init -q -b apk-builds
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add . && git commit -qm "APK de teste ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-builds
