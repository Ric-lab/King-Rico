name: Prévia compartilhada do Circus
on:
  push:
    branches: ['codex/**']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: king-rico-preview-previa
  cancel-in-progress: false
jobs:
  previa:
    if: startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KING_RICO_PREVIEW_PROJECT_ID: ${{ vars.KING_RICO_PREVIEW_PROJECT_ID || 'king-rico-previa-1408805633' }}
      KING_RICO_PREVIEW_PROVIDER: ${{ vars.KING_RICO_PREVIEW_PROVIDER || 'projects/61167555727/locations/global/workloadIdentityPools/king-rico-preview-github/providers/github' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validar projeto isolado de prévia
        run: node scripts/preview-config.mjs
      - run: npm ci --ignore-scripts
      - run: npm run build:preview
      - name: Autorizar GitHub no Google sem chave privada
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.KING_RICO_PREVIEW_PROJECT_ID }}
          workload_identity_provider: ${{ env.KING_RICO_PREVIEW_PROVIDER }}
          service_account: king-rico-preview@${{ env.KING_RICO_PREVIEW_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Publicar somente o canal previa
        id: hosting
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install firebase hosting:channel:deploy previa --config firebase.preview.generated.json --project "$KING_RICO_PREVIEW_PROJECT_ID" --expires 30d --non-interactive --json > "$RUNNER_TEMP/preview-result.json"
          node scripts/preview-result.mjs "$RUNNER_TEMP/preview-result.json"
      - name: Validar animações da prévia (3 fitas)
        env:
          KING_RICO_TEST_URL: ${{ steps.hosting.outputs.url }}
          KING_RICO_CHROMIUM: /usr/bin/google-chrome
        run: |
          python3 -m pip install playwright
          python3 tests/daily_reward_browser.py
          python3 tests/bigwin_flight_browser.py
          python3 tests/preview_motion_browser.py
          python3 tests/circus_columns_browser.py
          python3 tests/park_preview_browser.py
          python3 tests/park_repeat_browser.py
      - name: Guardar capturas da conferência
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: previa-circus-${{ github.sha }}
          path: work/preview-*.png
          if-no-files-found: ignore
      - name: Registrar bloqueio se a publicação não devolver URL
        if: failure() && steps.hosting.outputs.url == ''
        run: |
          echo '### Prévia indisponível' >> "$GITHUB_STEP_SUMMARY"
          echo 'A publicação não foi confirmada. Confira a etapa que falhou e docs/PREVIA-AUTENTICACAO.md. Nenhuma URL pode ser assumida.' >> "$GITHUB_STEP_SUMMARY"
